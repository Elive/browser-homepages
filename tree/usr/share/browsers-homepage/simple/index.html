            { text: "All of the radical thinking that evolved during the depression: Communist parties, Socialist parties, the Technocrats, Mankind United, etc.. All had remnants of decadence, of old language and older values that were imparted to them in their culture. So they were unable to come up with something fresh and new.", author: "Jacque Fresco" },
            { text: "All people need clean air, clean water, arable land, and a good relationship of language. I'm not superimposing Fresco's concepts. I'm using the Earth as the measure. In other words, we have to live in accordance with the carrying capacity of the Earth.", author: "Jacque Fresco" },
            { text: "All politicians are going to disappear... there is no need for a revolution, our society cannot be maintained by this kind of incompetence.", author: "Jacque Fresco" },
            { text: "Although many of us consider ourselves forward-thinkers, we still cling tenaciously to the old values of the monetary system. We accept, without sufficient consideration, a system that breeds inefficiencies and actually encourages the creation of shortages.", author: "Jacque Fresco" },
            { text: "Americans have been conditioned in their kind of society to get a different kind of car next year, to buy a new television set or a tape-recorder. We are radical as hell. But our political and social institutions have not changed. And this is where we are stagnating, because we always equate any new idea with communism or regimentation. Because we've been brought up to fear that which is new.", author: "Jacque Fresco" },
            { text: "An electrical engineer of 75 years ago, an intelligent one, couldn't get a job today. When you talk about intelligence, what are you talking about? It's an ongoing process. That's why there's no such thing as an intelligent person. There are people that are fairly well-informed in area A and B, not informed in area C.", author: "Jacque Fresco" },
            { text: "And if you elect the people with unquestionable ethics in government and if you ran out of resources, I can assure you crime would grow again.", author: "Jacque Fresco" },
            { text: "Any assumption of finality or utopia is really stupid, because there's never been any evidence to show that a person could design the best laptop. You can design the best laptop that you're familiar with at that time but they'll always get smaller, faster, more appropriate, lighter in weight. There are no final frontiers, there are no utopias, no best way of doing things. There's always a more appropriate way of doing things.", author: "Jacque Fresco" },
            { text: "Any law that's made by man that doesn't fit the circumstances of reality will be violated.", author: "Jacque Fresco" },
            { text: "As long as we continue to have wars, police, prisons, and crime, we will be in the pre-civilization stages.", author: "Jacque Fresco" },
            { text: "Before you launch a spaceship to the moon, you want to know how many people are going to be on the ship. Is there water on the moon? And so everything you design has to be in accordance with the physical reality.", author: "Jacque Fresco" },
            { text: "Can you take a primitive baby and make an aeronautical engineer out of them? Yes!... They don't have a primitive mind! They have a mind set by the primitive culture!", author: "Jacque Fresco" },
            { text: "Competition is dangerous, socially offensive, considered right and normal, because you are brought up to that value system. What kind of competition did Jesus have? What kind of competition is there in your body? Suppose your brain said, 'I'm the most important organ!' And the liver said, 'I am, and I want a Free Enterprise system!' You'd rot away in a month if every organ of your body went out for itself.", author: "Jacque Fresco" },
            { text: "Deal only with technical competence. There is no other kind of competence.", author: "Jacque Fresco" },
            { text: "Democracy is a con game. It’s a word invented to placate people to make them accept a given institution. All institutions sing, ‘We are free.’ The minute you hear ‘freedom’ and ‘democracy’, watch out! Because in a truly free nation, no one has to tell you you’re free.", author: "Jacque Fresco" },
            { text: "Do you think you participate in the selection of political parties? You don't. They are chosen for you. If you had a democracy, you would have four thousand political parties and they would disagree and argue among themselves.", author: "Jacque Fresco" },
            { text: "Earth is abundant with resources. Our practice of rationing resources through monetary methods is irrelevant and counterproductive to the well-being of people.", author: "Jacque Fresco" },
            { text: "Either we learn to live together in full cooperation or we will cause our own extinction.", author: "Jacque Fresco" },
            { text: "Even if a scientist feels that an airplane wing, due to mathematics or calculations, can hold up a given amount of weight, they still pile sandbags on it to see when it breaks, and they say 'you know my calculations are right' or 'they are not correct'. I love that system because it's free of bias and free of thinking that math can solve all the problems. You have to put your Math to test also. I think that every system that can be put to test should be put to test, and that all decisions should be based upon research.", author: "Jacque Fresco" },
            { text: "Every human being is perfectly well-adjusted for where they've been. What you've got to remember is, we can raise a dog to tear Japanese soldiers to pieces, or we can raise the same police dog to help the blind.", author: "Jacque Fresco" },
            { text: "Everything in this [TVP] society will apparently be redundant, meaning that you don't count on any one socially integrated computer. If that fails, another takes over.", author: "Jacque Fresco" },
            { text: "From our point of view, there are no criminals. There are people that have been subject to deprivation. They've been subject to environments that have little warmth, little love, little caring, and the result and the byproduct is criminal behavior.", author: "Jacque Fresco" },
            { text: "Future by Design refers to the application of the methods of science to the social system... If we used the scientific method throughout the world, the probability of war drops to zero. The probability of human suffering disappears. Deprivation, poverty, crime - all those things tend to disappear because there's no basis.", author: "Jacque Fresco" },
            { text: "Genetics has nothing to do with greed, business, or racial prejudice. All the operating systems in any society are part of your education: the books you read, the role models you follow, and the people you admire... Genes do not control values.", author: "Jacque Fresco" },
            { text: "Giving people the right to have their own opinion is very dangerous. Before, the majority believed the earth was flat; imagine scientists saying the earth is a little flat or a little round to please people.", author: "Jacque Fresco" },
            { text: "History and technology are respecters of no society, no individual opinions; but it moves on and we've got to be prepared to face the future.", author: "Jacque Fresco" },
            { text: "How can it be that in times of war, food reaches soldiers in minutes, and in peace it never arrives.", author: "Jacque Fresco" },
            { text: "Human behavior is subject to the same laws as any other natural phenomenon. Our customs, behaviors, and values are byproducts of our culture. No one is born with greed, prejudice, bigotry, patriotism and hatred; these are all learned behavior patterns. If the environment is unaltered, similar behavior will reoccur.", author: "Jacque Fresco" },
            { text: "Human beings are not responsible for their value system, these are learned.", author: "Jacque Fresco" },
            { text: "Human emotion is a very touchy subject. It's like racing your engine at a stop light. It doesn't take you anywhere. It doesn't serve any purpose. If you get a lump in your throat when you see hungry people, that's emotional. But when you can increase the agricultural yield per acre, that's caring - that's love. Love is transforming all of the verbal and paper proclamations to a way of life.", author: "Jacque Fresco" },
            { text: "Humans beings are not self-operating entities. We are operated by many resident forces. Of course, many of us are not aware of that. It looks like we are perfectly free, making our own decisions, e.g. ‘I know I think for myself...' That's an illusion.", author: "Jacque Fresco" },
            { text: "I don't have any expectations. Whatever happens is real. What I think SHOULD happen is not real. That's what hurts you: your expectations of the world.", author: "Jacque Fresco" },
            { text: "I don't know what the word 'sin' means, but I do know this: erroneous values can cause unbelievable suffering amongst people. And we... are mainly like children that do not have answers - that do not have solutions to problems.", author: "Jacque Fresco" },
            { text: "I don't know what the word sin means, but what I do know is this: Wrong values can cause incredible suffering among people.", author: "Jacque Fresco" },
            { text: "I don't like Jewish conditioning, but I don't like Catholic conditioning. I don't like Presbyterian conditioning, and I don't like American conditioning. It's the 'conditioning' that's the problem.", author: "Jacque Fresco" },
            { text: "I don't see anybody giving up anything. I see the system failing; like banks closing, automobile companies closing down. But nobody's giving up anything... The banks take over because they failed to make the payments, and that's when you get the social change. It takes events like that to turn people around.", author: "Jacque Fresco" },
            { text: "I don't think George Washington would be surprised at the decision-making today, because it's not that different - or Benjamin Franklin or anybody else. Our political system is based on opinions, projections, inadequacies, incompetence.", author: "Jacque Fresco" },
            { text: "I don't want to say to kids 'Stay away from drugs'. I want to make life so interesting for people that they don't want drugs. They don't want to dull their senses. They want to become keen and they want to become fully aware (I'm using older language) and conscious of their surroundings. It's painful to deaden your awareness when life is beautiful when what you do goes out to people and makes their lives better.", author: "Jacque Fresco" },
            { text: "I don't want you to take my word. I want you to walk over to any politician you know (or do not know) and ask them. 'How can you grow food faster without exhausting the soil and feed the hungry?' 'I don't know.' 'How can you make automobiles that don't hit each other?' 'I don't know.' 'How can you make highways safer?' 'I don't know.' They don't know anything! Don't take my word for it. Ask them!", author: "Jacque Fresco" },
            { text: "I feel that environment shapes our values. The people we know, the people we identify with. It isn't human nature that people have greed. It's reinforced in this culture. And by having greed, you get more things. You get more money. You do it off of the backs of many other people.", author: "Jacque Fresco" },
            { text: "I have no notions of a perfect society; I don’t know what that means. I know we can do much better than what we’ve got. I’m no utopian - I’m not a humanist that would like to see everybody living in warmth and harmony. I know that if we don’t live that way, we’ll kill each other and destroy the Earth.", author: "Jacque Fresco" },
            { text: "I just about have to call myself a social engineer, because I'm not just interested in architecture and learning theory, and human behavior, but I am interested in all aspects of the Earth and people, people mostly. I'm not too interested in technology, although it may seem that I advocate that. In actuality, all the wonders of technology to me are just so much junk unless it makes humans better.", author: "Jacque Fresco" },
            { text: "I said to one of these kids with an IQ of 24, 'suppose you want to rob that jewelry store across the way. How would you go about it, any way at all?' - 'I throw a bag of fecal matter in there, and the guy gets mad at my friend, and he runs after him and I clean off the counter.' That's where they live... How do you give people an IQ test that come from a different environment? How you know what they sense?", author: "Jacque Fresco" },
            { text: "I wanted to go to the south seas because I liked the idea of the natives sharing things; I'd read about that. Now, the chief, if he had six wives, and you were a stranger, he'd say, 'Here's my best wife. Maybe she will please you?' They felt their wives gave them so much joy, perhaps they'd give a visitor some joy. Their thinking about it was different. And that... caused me to ponder 'gee, that's not the way I saw things. Was that the way I saw things, or was that the way I was indoctrinated?' That's when I began to ask those questions: 'How do you know that anything you like makes sense, Jacque?' 'What about your own values?' Think about them - maybe they are senseless.", author: "Jacque Fresco" },
            { text: "I wanted to know what people thought, what they wanted, why they gelled on one system. And that each time a society arrived at a system, they tend to keep that system. They didn't even try to go beyond that. But in technology, whenever we made anything, we try to surpass it. The history of civilization, to me then, was the history of change: social change, human arrangements, homes, boats, planes, trains, etc.; all of them were in the process of social evolution, including our language, our outlook, our values, our behavior.", author: "Jacque Fresco" },
            { text: "I would love to go to Mexico and say 'What's your problem?' They'd say 'Well señor, we don't have the modern machinery you have'. Give them modern machinery. Build schools for them and they won't be coming over the border. What makes them come over the border? Hunger, lack of employment, etc.. They say 'It's the god damn Mexicans. You know what they're like!' It's nothing like that! Everything is shoved by something else.", author: "Jacque Fresco" },
            { text: "I would say the people we remember in history are not the people who made a buck or made a lots of money. They are people that have given their lives to benefit the lives of other people without financial gain.", author: "Jacque Fresco" },
            { text: "I'm strictly concerned with the environment that people are raised in, and if that environment is altered, so will behaviors be altered.", author: "Jacque Fresco" },
            { text: "I've never known The American Association of Architects to lay out a whole city system. They say the 'green' rooftop. Well, the greening of a building does not change society.", author: "Jacque Fresco" },
            { text: "If a nation refuses to join the world community, we feel that in time they will. Don't press it, don't twist their wrist, don't torture people, don't use military means. Give them a chance to look at our system. Give them a chance to study it and compare it to their own system. Although some nations may take longer than others to join with us in a global society, we do not force our values upon people.", author: "Jacque Fresco" },
            { text: "If a person doesn't have the means to live by, he's going to hurt somebody to get the money or whatever they need. That isn't dealing with the problem. 'Law' is really avoiding problems; it's just nailing a proclamation on the wall saying: 'You! Don't do this!'", author: "Jacque Fresco" },
            { text: "If people do not identify with The Venus Project, they will not join us. So, they have their independence. They can live any lifestyle they want to. We believe that, eventually, most people will join with The Venus Project and unify the world toward common goals. You can't force that.", author: "Jacque Fresco" },
            { text: "If someone comes and tells me, 'Hey you, you're obsolete!' it means I did a good job.", author: "Jacque Fresco" },
            { text: "If there is money involved, I don't care who you put in, it will be corrupted.", author: "Jacque Fresco" },
            { text: "If we behaved like banks we would be charged with fraud.", author: "Jacque Fresco" },
            { text: "If we use the scientific method throughout the world, the probability of war drops to zero. The probability of human suffering disappears. Deprivation, poverty, crime, etc., all those things tend to disappear, because there's no basis for it.", author: "Jacque Fresco" },
            { text: "If you believe in God, if you understand the teachings of all religions, there are no property lines in heaven, no banks, no personal positions in which one person is elevated above another, that if the Earth were the common heritage of all nations and all of the artificial boundaries removed that separate people, there would be no basis for war, no basis for armament.", author: "Jacque Fresco" },
            { text: "If you can learn how to remove the threat between nations, there's no need to build armament - and that's what the Venus Project is about.", author: "Jacque Fresco" },
            { text: "If you displace most people by machines, how are they gonna buy things? So, it's a self-contradictory system. This is the basis of understanding; that politics was good a hundred years ago, but it’s obsolete today.", author: "Jacque Fresco" },
            { text: "If you do nothing, I can assure you nothing will happen.", author: "Jacque Fresco" },
            { text: "If you don't understand why people conform; they've got a house, and they've got a car. And you're talking about a world that doesn't exist, that's never been that way. There's never has been a stable society in the history of civilization. That's why they're suspect of what you're talking about. So realize all those things, and then decide what you want to do: do you want to conform, or do you want to take on the job. I take on the job because I see no sense in conforming to the American way of life, or to the Swedish way of life, or the French way of life. I see no sense in it. [Instead] I see utter collapse and war as a continuous process. That's why I do not align myself with any particular nation. I'm a citizen of the world. I love nature and the Earth. I believe I'd like to take care of the rivers and the oceans for the good of all people, and myself! Otherwise, if I have children, they'll be bombed out. I have no security in this type of “me for myself” world.", author: "Jacque Fresco" },
            { text: "If you had a free society, you couldn't get people to go to war. If you had an intelligent type of upbringing amongst children, they would say 'There must be many other ways of solving problems, other than killing people.'", author: "Jacque Fresco" },
            { text: "If you have a lot of money in this society, you can afford better attorneys to defend you. So you don't have equal justice under the law.", author: "Jacque Fresco" },
            { text: "If you have based all your decisions on 'How much will it cost?', well, you wouldn't do anything, because everything costs a lot of money, except war - it MAKES a lot of money.", author: "Jacque Fresco" },
            { text: "If you like it [The Venus Project], if you feel it's a closer approximation to a better kind of society, come in and study more about it so that you get a good grasp of what it is we're trying to do.", author: "Jacque Fresco" },
            { text: "If you live vicariously through another person - let's say you rely on that person entirely - you live, and that person dies, you lose your identity because you put your identity in another person, which isn't a good thing to do. That's a kind of dependency.", author: "Jacque Fresco" },
            { text: "If you made a statue of me in front of a city, you hold back the future.", author: "Jacque Fresco" },
            { text: "If you really wish to put an end to war, poverty, hunger, territorial disputes, you must utilize all the world's resources as the common heritage of all the world's people. Anything less than that will remain with the same problems that you've had continuously for centuries.", author: "Jacque Fresco" },
            { text: "If you squander your resources in war, where you have 5,500 ships on the bottom of the sea today, loaded with copper, manganese, tungsten, all the kids that were killed, 300,000 aircraft shot down. With World War II [resources], we could have housed everybody on earth, built hospitals all over the world, schools all over the world. There's something dreadfully wrong with our culture.", author: "Jacque Fresco" },
            { text: "If you think you can’t change the world, it just means you're not one of those that will.", author: "Jacque Fresco" },
            { text: "If you try to keep things as they are, then I would say you have no concern for the future.", author: "Jacque Fresco" },
            { text: "If you want a world without war, without hunger, without poverty, it has to be in accordance with the carrying capacity of the Earth's resources. If you go beyond that, you're going to have trouble.", author: "Jacque Fresco" },
            { text: "If you want to know where the answers may lie, it is in the application of the methods of science with human concern and environmental concern. The Future by Design refers to the application of the methods of science, not scientists, the methods of science to the social system. Naturally, even the methods of science undergo change. As they change, so would the future.", author: "Jacque Fresco" },
            { text: "If you were to ask me to redesign the world and the way people live, the first thing I would have to do is to conduct a survey to find what we have; how much water we have, how many people there are, how much arable land area, etc. After I know that, then I can base the parameters of design on what we have.", author: "Jacque Fresco" },
            { text: "If you're brought up in a distorted environment, which we all live in today, any judge that raps a gavel and says '30 years!' is an ignoramus, because he has no idea of the factors that shape human behavior.", author: "Jacque Fresco" },
            { text: "If you're depressed, it means you're looking within yourself for answers and you can't get that.", author: "Jacque Fresco" },
            { text: "In The Venus Project, relationships become a science, not some arbitrary system that you inherit from your culture.", author: "Jacque Fresco" },
            { text: "In a Resource-Based Economy, the human condition is of prime concern with technology subordinate. In such an economy, production is accomplished totally by machines and the products are available to all. The concepts of work and earning a living become irrelevant. The focus is on having a life. In a money economy, when the human consequences of automation are neglected, it renders the advances of science and technology meaningless except to a select few.", author: "Jacque Fresco" },
            { text: "In our search for more, we have blinded ourselves to our personal responsibility for challenging these absurdities. A resource-based society considers us all equal shareholders of Earth. We are responsible both for the planet and for our relationship with each other.", author: "Jacque Fresco" },
            { text: "In the Bible, if you're religious, it says 'Thou shalt not kill'. It doesn't say you can kill Wednesdays and Thursdays. It says 'Thou shalt not kill'.", author: "Jacque Fresco" },
            { text: "In the emergency field, we don't select people to participate. All that is done long in advance of any emergency. So all the people are designated, lined up to handle any job. You don't need to go on a search in any emergency; it's done prior to the emergency.", author: "Jacque Fresco" },
            { text: "In the future, in a saner system, we would design products not to wear out and break down; to last as long as possible, so that the responsibility of the service sector would not be overloaded.", author: "Jacque Fresco" },
            { text: "In this system, we learn to like and worship nothing things. We want the signatures of movie stars, etc. That's a nothing thing - it's only used to show other people.", author: "Jacque Fresco" },
            { text: "In time of war we can give everybody uniforms, we can give everybody a gun. How come we have all that stuff in time of war? In times of peace we ought to do that!", author: "Jacque Fresco" },
            { text: "Instead of a law, a solution.", author: "Jacque Fresco" },
            { text: "Instead of a pentagon, you have a lot of people that are trained in bridging the difference between nations. The pentagon would serve as an intermediate organization to bridge the difference between cultures.", author: "Jacque Fresco" },
            { text: "Instead of working on patchwork, let's tackle the whole system.", author: "Jacque Fresco" },
            { text: "It is technology that solves problems, not politics.", author: "Jacque Fresco" },
            { text: "It seems that conditions were so abusive in some lands that they put in socialism, communism, whatever, or fascism that fits the conditions that people live under. None of them are the solution. All governments all through history have been corrupt.", author: "Jacque Fresco" },
            { text: "It was difficult for early forms of life to crawl out of the primordial slime without dragging some of it with them.", author: "Jacque Fresco" },
            { text: "It was living through the 1929 Great Depression that helped shape my social conscience. During this time, I realized the Earth was still the same place. Manufacturing plants were still intact, and resources were still there, but people didn’t have money to buy the products. I felt the rules of the game we play by were obsolete and insufficient... This began a life-long quest to finding solutions to the many problems that we have today.", author: "Jacque Fresco" },
            { text: "It's like the human body. If the brain said 'Hey, I do all the thinking. I want most of the energy of the body', then the liver starts choking. The liver says, 'without me you can't exist'. So the brain says, 'well here's a little bit'; the liver suffers. You cannot give certain things to some organs of the human body. The whole mechanism, the planet Earth, and all its inhabitants live here. And there is a way today, fortunately only today, with science and technology, to overcome these problems.", author: "Jacque Fresco" },
            { text: "It's much cheaper to give people things they need than to kill them.", author: "Jacque Fresco" },
            { text: "It's not easy to grasp this system, because we're subjects and we're immersed in an environment. No Chinese baby was ever born speaking Chinese. You can't inherit acquired characteristics. In other words, prejudice, racism, dialect, facial expressions, attitudes about marriage and children are all part of your environmental indoctrination. I don't say it's the same for people, their environments vary so they come out somewhat different. But the differences are not due to individuality. They're due to the environmental impressions that you pick up.", author: "Jacque Fresco" },
            { text: "Jobs are meant today to control people. You make them work the best years of their lives; they have nothing to show for it. We do not do that. We allow people to go to school and study what ever they want to study - music, art, painting, creative writing – all the things they want to do. They don’t want to go to work. Work is boring and repetitious. We hope to automate all jobs.", author: "Jacque Fresco" },
            { text: "Laws do not stop crime; they merely make noise about crime. They say 'Don't take anything that doesn't belong to you'. Well, that doesn't do anything.", author: "Jacque Fresco" },
            { text: "Learning to be flexible in values takes a long time.", author: "Jacque Fresco" },
            { text: "Love is a fluctuating thing, not a fixed thing. That's why we don't understand what's happening.", author: "Jacque Fresco" },
            { text: "Man is not separate from the environment; we're part of nature. And if we fail to recognize that, we're only going to hurt ourselves.", author: "Jacque Fresco" },
            { text: "Man is so stupid today that he's making nuclear weapons and improving them so that they're a thousand times more destructive than the nuclear weapon dropped on Hiroshima. If they continue in that direction, it will mean the end of the human race as we know it. Human beings are not wise enough 'yet' to use their innovative technology.", author: "Jacque Fresco" },
            { text: "Marriage was an institution to save kings and nobles from supporting your children.", author: "Jacque Fresco" },
            { text: "Morality is an outgrowth of the inability to manage systems.", author: "Jacque Fresco" },
            { text: "Most of the things you have been taught have very little or no meaning. The English language was not designed for communication.", author: "Jacque Fresco" },
            { text: "Most parents, when they see their children hanging out with children of bad behavior, move them away from that environment... when you want your child to be a doctor or a lawyer, you put them in a university environment. Engineers are not born engineers... they have to learn it. The way you behave is all learned!", author: "Jacque Fresco" },
            { text: "Most wars are for the control of resources and to maintain a position of differential advantage.", author: "Jacque Fresco" },
            { text: "No one makes decisions in The Venus Project. They're arrived at. In other words, if you want to know how long an object can last in a rotational field, like where they make tires, they put the tire against a concrete wheel and it turns for so long a period. That's how they can say that this tire is guaranteed for three years or ten years, by testing it, and The Venus Project puts every concept to test. Before we build a dam, we study what are the positive effects of that dam on society and what are the negative effects. You have to have a negative and positive study of any project before you even begin the project; the benefits and the negative aspects.", author: "Jacque Fresco" },
            { text: "One may reasonably ask: Why do people cling to the values and practices of the past, when they so obviously no longer work? Long-standing thought patterns are hard to overcome because they often appear to serve the interests of the individual, and old ways of thinking are simpler and easier to handle. In a two-valued way of thinking, as in good and bad, right and wrong, love and hate, cause and effect, very little logical analysis is involved.", author: "Jacque Fresco" },
            { text: "Our future does not depend on present-day beliefs or social customs, but will continue to evolve a set of values unique to its own time. There are no Utopias. The very notion of Utopia is static. The survival of any social system ultimately depends on its ability to allow for change to improve society as a whole.", author: "Jacque Fresco" },
            { text: "Our language in the future will change to a saner language where we have no argument in it. They say, 'Can there be such a language?' There is! When engineers talk to each other, it's not subject to interpretation. They use math; they use descriptive systems. If I interpreted what another engineer said in the way I think he meant it, you couldn't build bridges. You couldn't build dams or power transmission lines. The language has to have meaning. That's why when a doctor writes a prescription, if he prints it, it's the same all over the world.", author: "Jacque Fresco" },
            { text: "Our main problem is a lack of understanding of what it means to be human and that we are not separate from nature.", author: "Jacque Fresco" },
            { text: "Our proposals are submitted to the general public and to all educational institutions. We invite your participation. If enough people find the proposals acceptable and join with us in this new advocacy, we could form the nucleus of an organization to more effectively implement the aims of The Venus Project.", author: "Jacque Fresco" },
            { text: "People are conditioned to serve the interests of an established culture. Who does that to us? The owners of the institutions - the establishment. They give us a value system that would support existing structures, whether it be religious, non-religious, industrial, military, etc..", author: "Jacque Fresco" },
            { text: "People are not born liars, fearful, intolerant, and prejudiced; you learn it in the world you live in!", author: "Jacque Fresco" },
            { text: "People make assumptions that the wealthy stay in power. They do not. When systems break down, banks fail, industry fails. They shut the doors and say 'NO HELP WANTED'. You can't even sell your production plant if a newer system comes up. So, you can't hang on to the old system, even though you have a lot of money today. When the banks fail, you lose your money. When people aren't buying goods and services, you lose your industrial plant. You don't have to worry about people giving up anything.", author: "Jacque Fresco" },
            { text: "Picture this: a Roman family taking its kids to see the Christians being fed to the lions. And the kids are watching 'Dad, can we come next week to see Christians being fed to lions?' Are these kids sick? No! Their value system is distorted. So, I'm strictly concerned with the environment that people are reared in, raised in. And if that environment is altered, so will behavior be altered.", author: "Jacque Fresco" },
            { text: "Politics was good a hundred years ago. Today, politicians have no ability to solve any problems because they are not students of behavior. They are not students of agriculture, oceanography, they know nothing about the factors that operate the world. So, they say things that people like to hear, and that gets them elected. Now scientists, on the other hand, are not concerned with public approval. Even if everybody on earth believed the earth was flat, they would say, 'You're wrong. This is the evidence we have to support the fact that the earth is round'. They don't say, 'it's a little round and a little flat' - that's politicians.", author: "Jacque Fresco" },
            { text: "Population control is dependent upon education. We feel, an educated population needs no control.", author: "Jacque Fresco" },
            { text: "Sane - meaning the most operant behavior for a given set of circumstances.", author: "Jacque Fresco" },
            { text: "Say the ship sunk, and you found yourself on an island, and you had say 10 million dollars. And you had gold and diamonds. But the island has no water, no arable land, and no fish. You have nothing. So all this emphasis on money, which doesn't really represent anything but some way of exploiting other people. When the bottom line is profit, it's very dangerous.", author: "Jacque Fresco" },
            { text: "Scientists predict that if we could develop and harness only 1% of the geothermal energy available in the Earth's crust, our energy problems would be over.", author: "Jacque Fresco" },
            { text: "Scientists today are commercially rewarded for being chemists, or working for the drug companies, or working for the aircraft companies. They're just as corrupt as anyone else. And scientists, if they were scientists, they'd say, 'What makes war?, Why are we going to war with Germany?, What's the problem?, What makes a man the way they are?'", author: "Jacque Fresco" },
            { text: "So everybody in the world represents an extension to their life, rather than 'I've got just the car you're looking for', rather everybody selling themselves and making a profit on one another. That will motivate them to see that everything they do goes out there for all humanity. All children are well cared for; all older folks are taken care of. So that means they will be taken care of, because everybody cares about everybody else.", author: "Jacque Fresco" },
            { text: "So on down the line, superstition prevails wherever ignorance prevails. Myth is a way of saying to the little guy working out there in the field when he says 'What does all this amount to? I never seem to be getting anywhere.' 'When you kick the bucket, everything is there for you. If you don't get it in this life, you'll get it in the next, if you remain good.'", author: "Jacque Fresco" },
            { text: "Soldiers are just killing machines; they are trained to kill.", author: "Jacque Fresco" },
            { text: "Some people say I'm utopian; I say my designs will be a straightjacket for the children of the future.", author: "Jacque Fresco" },
            { text: "Sometimes a person comes up to me, and he says, 'I have ten children.' And then I say, 'What are they for?' Just having children is not wisdom! No, I don't believe in depopulation - I believe in educating the public. Why don't you put 10,000 people on the boat? Cause it'll sink! The displacement of that boat determines how many people you can put on it, not Fresco.", author: "Jacque Fresco" },
            { text: "Stupidity means: lack of information regarding a certain type of problem.", author: "Jacque Fresco" },
            { text: "Superstition prevails where ignorance prevails.", author: "Jacque Fresco" },
            { text: "Technicians do not tell you what to do or how to live. They merely carry out the functions of designing elevators, transportation units, bridges, housing systems... They do not tell people what to do, what to think, or how to live. That's a mistake that most people make. They think that a resource-based economy has technicians that also tell you what lifestyle to use. No they don't! The resources determine that. All that the technicians do is build a system that can utilize those resources for the benefit of all the people involved.", author: "Jacque Fresco" },
            { text: "That is what is wrong with psychology and psychiatrists, they try to adjust you to this system, you have to be some kind of idiot to do that, the system is the generator of most of the problems you have today...", author: "Jacque Fresco" },
            { text: "That's how [designing technical solutions] I say I care. I don't know what it means 'I believe in peace and harmony and goodwill'. I understand the language, but I know it has no backup.", author: "Jacque Fresco" },
            { text: "The Earth is abundant with resources; our practice of rationing resources through monetary methods is irrelevant and counterproductive to the well-being of people. Modern society has highly advanced technologies and can easily provide more than enough for a high standard of living for all by implementing a Resource-Based Economy. Simply stated, a Resource-Based Economy uses existing resources rather than money, and provides an equitable distribution of goods and services in a humane and efficient manner for the entire population. It is a system in which all natural, man-made, machine-made, and synthetic resources are available without the use of money, credit, barter or any other form of debt... In an economy based on resources rather than money, we can easily produce the necessities of life and provide a high standard of living for all.", author: "Jacque Fresco" },
            { text: "The Pentagon is made of people, military. And the military has been notoriously stupid because they are not well-read. They don't understand this. What we should have in Washington if we were a healthy society, I mean mentally healthy, would be a Pentagon of sociologists, social scientists who could bridge the differences between nations.", author: "Jacque Fresco" },
            { text: "The Pentagon is not a problem solving organization. It's a militaristic approach to problems and that never did work. We've had wars ever since man has been on Earth. We've had wars continuously, and deprivation and destruction. War is not the answer.", author: "Jacque Fresco" },
            { text: "The Venus Project does everything that religion talks about. It builds the brotherhood of man. It doesn't kill, there's no wars. Don't forget, the bible says 'Do unto others as you would have them do unto you.' It says 'thou shalt not kill.' The Venus Project is all about that, whereas the verbal systems of religion talk about and around the subject but they don't tell us how to do it or how to get from here to there. They really don't know how. It isn't that they don't want to, they don't know how.", author: "Jacque Fresco" },
            { text: "The Venus Project is [about] sharing all the earth's resources with all the world's people. A Resource-Based Economy is using resources rather than money; making all things available to all people. And if you don't do that, you'll have wars, robbery, crimes of all kinds. Every criminal is made by this culture. Once you make things available, that's the end of crime.", author: "Jacque Fresco" },
            { text: "The Venus Project is a concept that could happen today, but it is not up to me. It depends on what others do to help bring it about.", author: "Jacque Fresco" },
            { text: "The Venus Project is an organization based on the ideas, designs, and directions presented in this book, representing the life's work of its originator and Project Director, Jacque Fresco. Its 21-acre research and design center is located in Venus, Florida, where the future is taking shape now. The Venus Project's purpose is to design, develop, and prepare plans to build the first experimental city. Here, we are developing alternative energy systems, city designs, transportation, manufacturing methods, and more. Along with this research, we are creating blueprints, renderings and models, while holding seminars and producing books, videos and other materials to introduce people to the aims of The Venus Project and our vision for the future.", author: "Jacque Fresco" },
            { text: "The Venus Project is not about new cities or new architecture. It's about a way of thinking.", author: "Jacque Fresco" },
            { text: "The Venus Project is the redesign of our culture. To design a society with the intelligent use of science and technology to lift up the lives of everyone, not a selected few.", author: "Jacque Fresco" },
            { text: "The Venus Project wants to use a Resource Based Economy. Meaning, we have enough resources to take care of all the conditions and problems.", author: "Jacque Fresco" },
            { text: "The [monetary] system generates predatory behavior, where we take advantage of other people... So most people are out to take care of themselves. If you don't take care of yourself, no one is going to take care of you.", author: "Jacque Fresco" },
            { text: "The amount of superstition that a culture can absorb would be directly proportionate to the amount of information people have. So, in the future, with adequate supply of information, more than that which is given today, considerably more, you don't have 'Knock wood', 'Today's my lucky day', 'When your number's up, it's up'. All that will disappear in the future.", author: "Jacque Fresco" },
            { text: "The difference between a serial killer and a saint is environment. That's a very hard thing to accept because that raises a lot of questions.", author: "Jacque Fresco" },
            { text: "The economic alternative to most of the world's societies is to declare the earth as the common heritage of all the world's people. And then remove all the artificial boundaries so people can travel anywhere on earth without a passport.", author: "Jacque Fresco" },
            { text: "The education that you get is mostly propaganda. They condition a man to become an engineer, another man a chemist, another man a physicist and then they go to war... If they were scientists, really scientists, they would wonder what war is, why do people kill each other? What is a serial killer, what makes them that way?", author: "Jacque Fresco" },
            { text: "The entire money-structured and materialistic-oriented society is a false society. ...our society will go down in history as the lowest development in man. We have the brains, the know-how, the technology, and the feasibility to build an entire new civilization.", author: "Jacque Fresco" },
            { text: "The future is our responsibility, but change will not take place until the majority lose confidence in their dictators' and elected officials' ability to solve problems. It will likely take an economic catastrophe resulting in enormous human suffering to bring about true social change.", author: "Jacque Fresco" },
            { text: "The killing of a man never destroys his value system.", author: "Jacque Fresco" },
            { text: "The money system was designed hundreds of years ago and it no longer fits the situation. So when this society grows up, they will understand that money is no longer necessary. They can go to a new kind of economy. No society in history ever looked into the future and designed things to fit that. They waited until - boom! the bottom fell, then they changed, you see? ... unfortunately.", author: "Jacque Fresco" },
            { text: "The more intelligent our children, the better our lives and the richer our culture will be.", author: "Jacque Fresco" },
            { text: "The more justice you seek, the more hurt you feel, because there is no such justice. There is what is out there. That's all.", author: "Jacque Fresco" },
            { text: "The only limitations on the future of the humankind are those we impose upon ourselves.", author: "Jacque Fresco" },
            { text: "The people in Washington should know more about human behavior, the latest technologies, etc.. They tell you 'If you want freedom, write your congressman'. Why do you have to write them? They should know all those things. When you fly on an airplane, you don't have to write the pilot saying 'You've been flying at an angle for a half an hour. Straighten up'. They know their business.", author: "Jacque Fresco" },
            { text: "The process with which you think is based on the indoctrination that is imposed by society. Therefore your range of thought is limited by the dominant values of our society.", author: "Jacque Fresco" },
            { text: "The real future, people will be different. Well today, a person feels good helping an old lady across the street. But where does she go when she gets across the street?", author: "Jacque Fresco" },
            { text: "The reason nations invade other nations is because of scarcity. When a few nations control most of the earth's resources, you've got to have territorial disputes, no matter how many treaties you sign or laws you make. If you don't declare all the earth's resources as the common heritage of all the world's people and bring all the separate nations together in one unified system, there is no solution other than that. That is why we recommend the Resource-Based Economy.", author: "Jacque Fresco" },
            { text: "The scientific community has to be made, it doesn't exist yet. The scientific community that is against nuclear weapons, what is their proposal for ending it? If you don't come up with a workable proposal for ending the development of nuclear weapons, you've done nothing.", author: "Jacque Fresco" },
            { text: "The society that I'm talking about is global cooperation, where all the nations work toward improving the lot of humankind. Now why do that? Because the smarter people are, the richer and more secure everybody is!", author: "Jacque Fresco" },
            { text: "The system you're brought up under tries to make you like the people that succeeded in that system.", author: "Jacque Fresco" },
            { text: "The way we use technology today is completely wasteful. We duplicate many vacuum cleaners, tools, etc.. In the future, we will make the best of all equipment and make it available to everyone.", author: "Jacque Fresco" },
            { text: "The whole basis of social operation today is a profit system. As long as you have a profit system, all your universities are tuned to the monetary system. The universities are not tuned to human betterment. They are not tuned to the well-being of society. The universities are supported by the food industry, by wealthy corporations, and if you threaten them at the university level, that support will be withdrawn. You will not be permitted to talk against the mass productive systems of the present day economy. If you speak against those systems at a university, they would lose their support.", author: "Jacque Fresco" },
            { text: "The whole idea of the future is to stop putting up little cities and buildings, but to work on a whole system.", author: "Jacque Fresco" },
            { text: "The word freedom is a stupidity; make me a list of the things I can do and those I cannot, that is what we live, not freedom, there is no such thing.", author: "Jacque Fresco" },
            { text: "There are a lot of things that are going to happen, whether you like it or not. The future cannot be stopped by anyone. It is a continuous progression.", author: "Jacque Fresco" },
            { text: "There are no bad people, there are people with insufficient information to make appropriate decisions.", author: "Jacque Fresco" },
            { text: "There are no black problems, or Polish problems, or Jewish problems, or Greek problems, or women's problems... there are human problems!", author: "Jacque Fresco" },
            { text: "There are no good or bad people, there are no corrupt people or dishonest people, creative people, lazy people. All that's bunk!", author: "Jacque Fresco" },
            { text: "There are no good or bad people. There are people raised in different environments in which they believe.", author: "Jacque Fresco" },
            { text: "There is nothing wrong with a southerner or a member of the Ku Klux Klan. It is the environment in which he was raised. And today's psychologists and psychiatrists are so stupid that they deal with the individual. It is actually the environment that makes them that way.", author: "Jacque Fresco" },
            { text: "There is only a policeman in front of something that people have need for and don't have access to, so you put a guard there. But if orange trees and apple trees grew all over the place, you couldn't sell them.", author: "Jacque Fresco" },
            { text: "There isn't anything that is said that 'someone' won't take issue with.", author: "Jacque Fresco" },
            { text: "There was a time when most people believed that the decisions of the majority were very close to reality. But there was also a time when the majority of people believed the Earth was flat. And if you asked them whether they were sincere, they said, 'Of course! You can see it's flat!' So, they'd break a sincerity meter. So it isn't sincerity that the world needs. It needs the intelligent management of the Earth's resources.", author: "Jacque Fresco" },
            { text: "There will be no problems such as racial problems. There will be opportunities for all people. We do it because the smarter your children are, the richer my life.", author: "Jacque Fresco" },
            { text: "There's no debates; there is dialogue. You know the difference? You talk with a person, they talk back. Debate is out to win. We're not out to win. We're out to accomplish a given task with a minimum expenditure of energy and temperament.", author: "Jacque Fresco" },
            { text: "They are against abortion. One would imagine they would be against war because there they are killing thousands of people. Bombing children, everyone, unborn children, mothers. What happens with these people? Well, I'll tell you what happens. They are brain-insufficient. They don't have enough up here to string anything together.", author: "Jacque Fresco" },
            { text: "They want to find intelligence out in space, and they still haven't found it on Earth.", author: "Jacque Fresco" },
            // { text: "To give people the right to have their own opinion is very dangerous.", author: "Jacque Fresco" },
            { text: "Today there are chemists. They're scientific in chemistry. Then there's structural engineers that are scientific in structures, but they're not scientific in human relations. They know nothing about it or little about human behavior. So, I'm saying there's no such thing as a scientist, yet!", author: "Jacque Fresco" },
            { text: "Today we can produce an abundance for all countries so they need not invade other countries. We can provide for their needs.", author: "Jacque Fresco" },
            { text: "Unfortunately, money doesn't represent things in existence. If you set a value on every tree, every inch of arable land, all the water, and you printed money proportionate to the resources so that the money represents resources, then it can have meaning. But today, that is not accomplished. Although they may tell you that demand will really bring about these things. No, demand doesn't bring about the things. Available resources do. If money doesn't represent available resources, it has no basis for social management.", author: "Jacque Fresco" },
            { text: "Unfortunately, we tend to support basic values and traditions that reflect the past, without questioning their appropriateness to the present or the future.", author: "Jacque Fresco" },
            { text: "War is a crude and vulgar expression by immature nations that don't know how to work out areas of agreement.", author: "Jacque Fresco" },
            { text: "War is not the only form of violence imposed on people through inadequate social arrangements. There is also hunger, poverty and scarcity. The use of money and the creation of debt fosters economic insecurity, which perpetuates crime, lawlessness and resentment. Paper proclamations and treaties do not alter the facts of scarcity and insecurity, and nationalism tends only to propagate the separation of nations and the world's people.", author: "Jacque Fresco" },
            { text: "War is the ultimate expression of ignorance.", author: "Jacque Fresco" },
            { text: "We accept, without sufficient consideration, a system that breeds inefficiencies and actually encourages the creation of shortages.", author: "Jacque Fresco" },
            { text: "We are a reflection of the culture we live in.", author: "Jacque Fresco" },
            { text: "We are inclined not to listen to people that are not like us... We are not sane yet.", author: "Jacque Fresco" },
            { text: "We are well-aware that no one can actually foretell the shape of the future. We can only extrapolate from present information and trends. Population growth, technological change, worldwide environmental conditions, and available resources are the primary criteria for future projections. We are also aware that there is no single philosophy or point of view, whether religious, political, scientific or ideological, that someone would not be able to take issue with. We feel certain, however, that the only aspects of The Venus Project that may appear threatening are those which others erroneously project onto it.", author: "Jacque Fresco" },
            { text: "We can achieve a level of production so high that it'd be superfluous to put a price tag on things. And that's the beginning of a civilized world.", author: "Jacque Fresco" },
            { text: "We can build rockets to explore outer space and enhance the quality of life on Earth, or we can use them to destroy other nations.", author: "Jacque Fresco" },
            { text: "We don't know how to live together on Earth, so how the hell are we going to live together on Mars?", author: "Jacque Fresco" },
            { text: "We don't make decisions in the Venus Project. We arrive at them by putting things to test and trying them out. If they don't work, we change them. Nothing is rigid in the Venus Project. We have no fixed concepts of anything. We just have different approaches to problems and we check them out. Those which work, we put to use. If they don't work, we modify them.", author: "Jacque Fresco" },
            { text: "We don't want to eliminate anything, we want to overcome the need to have certain things.", author: "Jacque Fresco" },
            { text: "We have the brains, the know-how, the technology and the feasibility to build an entirely new civilization.", author: "Jacque Fresco" },
            { text: "We have the resources. Money is an interference because it limits our ability, and it limits our dreams.", author: "Jacque Fresco" },
            { text: "We have the technology to build a global paradise on earth, and at the same time, we have the power to end life as we know it. I am a futurist. I cannot predict the actual future - only what it can be if we manage the earth and its resources intelligently.", author: "Jacque Fresco" },
            { text: "We have to ask ourselves what kind of world we want to live in.", author: "Jacque Fresco" },
            { text: "We have to learn how to manage real economics, not for profit, for human betterment. Then you'll see the beginning of the civilized world. And once we get that in, children will not understand how we couldn't see that in the old days. They'll say 'Dad, wasn't that obvious that if you live to yourself you die to yourself?'", author: "Jacque Fresco" },
            { text: "We have to manage the Earth in accordance with the Earth's productive capability, not some opinions of a senator, congressman, or industrial leader.", author: "Jacque Fresco" },
            { text: "We live in a monetary-oriented world, we think in terms of money. But the real value of any nation is its resources. Without resources you have nothing!", author: "Jacque Fresco" },
            { text: "We must learn to outgrow our egos in exchange for constructive dialogue rather than debate. In addition, we must be capable of stating problems and proposing solutions clearly and succinctly, without distortion of meaning or misunderstanding, even when these solutions are radically opposed to accepted norms.", author: "Jacque Fresco" },
            { text: "We must look at alternatives objectively, and not try to fit the future into our present social mold.", author: "Jacque Fresco" },
            { text: "We must stop constantly fighting for human rights and equal justice in an unjust system, and start building a society where equal rights are an integral part of the design.", author: "Jacque Fresco" },
            { text: "We talk about civilization as though it's a static state. There are no civilized people yet. It's a process that's constantly going on. We're not civilized. It's an ongoing process; and so we never become fully civilized. We'd have to know quite a bit in order to behave in the most constructive manner.", author: "Jacque Fresco" },
            { text: "We will never know what anyone is really like, until everyone has economic security and doesn't have to answer to anyone else.", author: "Jacque Fresco" },
            { text: "We won't make the history books of the future. We are that ignorant. Not in technology. We're doing fine in computers and electronics, but the human value system is not moving fast enough. Governments are not changing fast enough.", author: "Jacque Fresco" },
            { text: "We would not venture into space until the world learns to live together in peace. We're not civilized yet. If you let nations go into space separately, I can assure you there will be nuclear weapons out in space, sooner or later. We're not wise enough yet to use our intelligence to the benefit of humanity and protection of the environment. That should be obvious to you.", author: "Jacque Fresco" },
            { text: "What if a person doesn't want to live in The Venus Project? Can they live their own lifestyle? Yes they can! They don't have to live under the Venus Project. If there's a religious group that wants to build its own community, and wants nothing to do with the Venus Project, say the Amish People, they are free to live any lifestyle they want to.", author: "Jacque Fresco" },
            { text: "What is the meaning of life? What is consciousness and the mind? Why am I here? What is my relationship to God and the universe? These questions have been asked for centuries, but they are irrelevant to achieving social progress. These are unanswerable questions because they don’t have referents in the real world. The posing of such ambiguous questions doesn’t express concern for fellow human beings, or a desire to elevate their condition. Such musings are gibberish in terms of practicality, and as impotent as wailing over an injured person instead of seeking medical attention for them.", author: "Jacque Fresco" },
            { text: "What is to be done precisely? An international system for the maximum utilization of the world's resources without any special privileged group! There's no technical elite. No scientific group that sit on cushions, that make the decisions. What form of government? Resource management government. Non-political: neither communist, fascist, socialist, free-enterprise. Merely the installation of resource management to enhance the lives of all human beings.", author: "Jacque Fresco" },
            { text: "What we really need is an 'emergent society'. Emergent society means that there's no Utopia, no fixed system. If I were to design a city, and that city would be a straight jacket to the kids of the future, they'll design their own cities. So if you make a statue of me, you hold back society.", author: "Jacque Fresco" },
            { text: "What we spent on World War II, us, the Germans, the French, the English, all the money we spent on equipment could have built hospitals all over the world, schools, we could have cleaned up cities all over the world. How stupid can we be?", author: "Jacque Fresco" },
            { text: "What you consider popular and normal today will be considered aberrant behavior in the future.", author: "Jacque Fresco" },
            { text: "When I talk about thinking, reasoning and putting things together, we're talking about the forces that shape human behavior. I believe that all human behavior is lawful; that the reactions and values that all people have are perfectly lawful to the environment that they come from. Every human being is perfectly well-adjusted from where they are coming from, from their background and experience.", author: "Jacque Fresco" },
            { text: "When I talk to a person, and they reject what I say, I feel I don't know how to get to them. That's the proper word. Instead of saying 'That son of a bitch; I couldn't get to him'. You know what I mean? That's your expectations that hurt you, not the world. The world never hurts you. It's your own expectations that hurt", author: "Jacque Fresco" },
            { text: "When a baby fox sees a porcupine, it says 'What have we here? I don't know'. It gets closer to the porcupine and finally it gets a quill and he stays away from the porcupine. If you raise your children and try to avoid experiences that had hurt you, and you buy them every toy that they want, you produce a blob of jello. Some degree of challenge, some degree of stress is necessary.", author: "Jacque Fresco" },
            { text: "When children say, 'Daddy, what's the greatest country in the world?', of course, 'Our country is the greatest country in the world.' 'Which god is the right god, Daddy?' 'Our god! All the other gods are false gods.'", author: "Jacque Fresco" },
            { text: "When few nations control most of the earth's resources you're going to have trouble. You're going to have territorial disputes, wars. No matter how many treaties you sign or no matter how many laws you make, it won't stop that condition. The human condition, which causes people to invade other lands, torture people, build armies to protect what they have, this is not going to work, it never has worked. It's as old as man. So what we need is an entirely different approach to the human problem, and preserving the earth for the future; future generations.", author: "Jacque Fresco" },
            { text: "When we talk about science, we're talking about a method of looking at a situation, a method of evaluation that differs from the opinionated system. 'If you ask me, I'll tell you!' The scientific method has no special connection to truth. It really has a better way of looking at things than the earlier systems, where everything was attributed to gods or demons.", author: "Jacque Fresco" },
            { text: "When you bomb other cities, no matter where they are, you are building hatred; human hatred for the future.", author: "Jacque Fresco" },
            { text: "When you connect up the country, all the computers, to production, distribution, agriculture, etc., you have a nervous system which maintains dynamic equilibrium in production and distribution of goods and services, without money.", author: "Jacque Fresco" },
            { text: "When you give a doll to a girl you are programming her; let the girl choose what she wants, be it a laboratory set or an electric train, don't start giving them or tying a big bow in her hair, because what you are producing is an object in itself.", author: "Jacque Fresco" },
            { text: "When you go on with a word like civilization, it sounds like something that was attained. As long as you have war, police, prisons, crime, you're in the early stages of civilization; what they call civilization.", author: "Jacque Fresco" },
            { text: "When you go to school, the first thing they do to you is you raise your right hand; you don't even know which is your right hand. And you pledge allegiance to a flag, but you've never seen all the other flags of the world. You pledge allegiance to the American way and the American way doesn't exist. When I went to school, the beds we slept in were designed in England. The electric battery came from the Arabs; it was designed 600 years before Christ. We've learned a lot from so many people. And most of us are alive because of Louis Pasteur. So we owe so much to so many. 'To get away from patriotism' - Einstein said that. To surrender our concepts of individual uniqueness in exchange for constructive cooperation in human endeavor. This is the future. Whether you can see it or not depends on whether there will BE a future.", author: "Jacque Fresco" },
            { text: "When you live in a false society that bases its wealth upon money, then that society itself will collapse eventually. Not because I say so, but because it's not based on physical referents.", author: "Jacque Fresco" },
            { text: "When you study architecture, all the houses as a rule have a pointing roof. That's conventional. Architects do not design cities for people, they design for business. They design things that will sell. It's an ego problem. They design the tallest building... I said 'Why do you want the tallest building in the world?' 'We want to be better than the United States'. It's like infantile. The prince is an asshole.", author: "Jacque Fresco" },
            { text: "When you're born into a polluted world, with smog in the air and automobile pollution, you say 'I guess that's the way it is'. It isn't that way! It's because the people in charge of government are totally incompetent.", author: "Jacque Fresco" },
            { text: "When you're brought up in the slums where every kid grabs what he can grab, otherwise there's nothing left for you! You understand? You're brought up with a philosophy that parallels where you're coming from. So, when people steal, I say 'Every human being is lawful'. They obey natural law. What you've been exposed to, if it's hatred, all that is lawful!", author: "Jacque Fresco" },
            { text: "Working with drug addicts, alcoholics, and so-called juvenile delinquents in New York City convinced me that, instead of working with individuals, more effective methods would deal with the societal conditions that create dysfunctional behaviors in the first place.", author: "Jacque Fresco" },
            { text: "You can lose your identity if you're brought up with a philosophy of life that doesn't reinforce you. If you're brought up with a set of values: 'Do the right thing and everything will work out all right', and if it doesn't work out all right, you become depressed because you lose predictability.", author: "Jacque Fresco" },
            { text: "You can't be human, or decent, without the knowledge to overcome scarcity.", author: "Jacque Fresco" },
            { text: "You can't exceed the system with language. You can only exceed the system with events; recommended procedures that are better. You can't exceed the system by telling people to be good, be kind, be considerate. You have to take away the conditions that makes it necessary for you to be kind. And to be kind, you design highways that aren't slippery; where no accidents, or less accidents, occur. In the future, everybody becomes an innovator - a creator.", author: "Jacque Fresco" },
            { text: "You can't find the answers by declaring a society democratic; you can only find the answers by research and development. You can't find the answers by putting people of high moral character in government; you can only find the answers by innovation: by studying the systems and the problems, and working on methods of alleviating those problems.", author: "Jacque Fresco" },
            { text: "You cannot advocate decency and ethics. You must design the conditions that eliminate the problems. In scarcity, people will tend to steal. If you make things available, people tend not to steal.", author: "Jacque Fresco" },
            { text: "You cannot control people unless you misinform them as much as possible... If you teach people to think and reason, you won't be able to get anyone to enlist in the army in times of war. You won't be able to move people in mass. So you make them all the same.", author: "Jacque Fresco" },
            { text: "You cannot solve problems by force. The nations of the future, if they survive, will not have armies, navies, marines, national guards, police, or prisons. We'll do away with the need for those conditions. This is what The Venus Project is about.", author: "Jacque Fresco" },
            { text: "You don't have to give scientists that problem [how to make a better world] if they are raised to be scientists. They're not today. They are raised to be a cog in the wheel: chemist, engineer, physicist, biologist..., all utilized to serve the system they're reared in.", author: "Jacque Fresco" },
            { text: "You don't see the plug connected to the environment, so it looks like we're free, wandering around. Take the oxygen away, we all die immediately. Take plant life away, we die. And without the sun, all the plants die. So we are connected.", author: "Jacque Fresco" },
            { text: "You don't want to own anything. You don't want money. What you do want is 'access' to things!", author: "Jacque Fresco" },
            { text: "You have to be wise enough not to antagonize people who think differently than you.", author: "Jacque Fresco" },
            { text: "You have to take care of everybody or the system doesn't work.", author: "Jacque Fresco" },
            { text: "You must educate people to live with that [physical laws]. In other words you have to tell people, even during the instruction of learning to fly an airplane, what you can't do, what your landing speed has to be, if you don't have a certain speed you will not rise off the ground, if you don't maintain the speed landing your craft will fall to the ground... So these are laws, physical laws, and we must become aware of the physical laws that affect human behavior, our values, our lifestyle.", author: "Jacque Fresco" },
            { text: "You must face the world you live in and you must tackle those problems. And you don't make laws to avoid problems - you change the situation so you don't have that problem.", author: "Jacque Fresco" },
            { text: "You reorient the environment and that, in turn, reorients people. But if you reorient people without touching the environment, it'll slip back.", author: "Jacque Fresco" },
            { text: "You should never give a Nobel prize to one person. All these people are hard working trying to find the answers.", author: "Jacque Fresco" },
            { text: "Your range of thought is limited by the dominant values of our society.", author: "Jacque Fresco" },
            { text: "[The Venus Project] is not Utopian or Orwellian, nor does it reflect the dreams of impractical idealists. Instead, it offers attainable goals requiring only the intelligent application of what we already know. The only limitations are those which we impose upon ourselves.", author: "Jacque Fresco" },

            // Robert G. Ingersoll
            { text: "Why should we place Christ at the top and summit of the human race? Was he kinder, more forgiving, more self-sacrificing than Buddha? Was he wiser, did he meet death with more perfect calmness, than Socrates? Was he more patient, more charitable, than Epictetus? Was he a greater philosopher, a deeper thinker, than Epicurus? In what respect was he the superior of Zoroaster? Was he gentler than Lao-tsze, more universal than Confucius? Were his ideas of human rights and duties superior to those of Zeno? Did he express grander truths than Cicero? Was his mind subtler than Spinoza’s? Was his brain equal to Kepler’s or Newton’s? Was he grander in death – a sublimer martyr than Bruno? Was he in intelligence, in the force and beauty of expression, in breadth and scope of thought, in wealth of illustration, in aptness of comparison, in knowledge of the human brain and heart, of all passions, hopes and fears, the equal of Shakespeare, the greatest of the human race?", author: "Robert G. Ingersoll" },

            // Rosabeth Moss Kanter
            { text: "After years of telling corporate citizens to ‘trust the system,’ many companies must relearn instead to trust their people – and encourage their people to use neglected creative capacities in order to tap the most potent economic stimulus of all: idea power.", author: "Rosabeth Moss Kanter" },
            { text: "Mindless habitual behavior is the enemy of innovation.", author: "Rosabeth Moss Kanter" },

            // Rumi
            { text: "What you seek is seeking you.", author: "Rumi" },

            // Sean Patrick
            { text: "Einstein said that “imagination is more important than knowledge,” because “knowledge is limited to all we now know and understand, while imagination embraces the entire world, and all there ever will be to know and understand.", author: "Sean Patrick" },
            { text: "Facts and ideas are dead in themselves and it is the imagination that gives life to them.", author: "Sean Patrick" },
            { text: "Henry Ford failed in business several times and was flat broke five times before he founded the Ford Motor Company.", author: "Sean Patrick" },
            { text: "Imagination is the life force of the genius code.", author: "Sean Patrick" },
            { text: "It takes curiosity to find your call to adventure, it takes courage to venture into the unknown, and it takes imagination to create your path.", author: "Sean Patrick" },
            { text: "It's no coincidence that geniuses not only dare to dream of the impossible for their work, but do the same for their lives. They're audacious enough to think that they're not just an ordinary player.", author: "Sean Patrick" },
            { text: "It’s an essential part of becoming more creative. Expand your interests in life. Seek out new, interesting experiences, no matter how mundane or inconsequential they might seem to others.", author: "Sean Patrick" },
            { text: "The seed of greatness exists in every human being. Whether it sprouts or not is our choice.", author: "Sean Patrick" },
            { text: "This is the beauty of imagination. An unexpected dead end in one journey is merely an opportunity to set a new course for another.", author: "Sean Patrick" },
            { text: "Thousands of geniuses live and die undiscovered—either by themselves or by others.", author: "Sean Patrick" },

            // Socrates
            { text: "The unexamined life is not worth living.", author: "Socrates" },

            // T. S. Eliot
            { text: "We shall not cease from exploration, and at the end of all our exploring will be to arrive where we started and know the place for the first time.", author: "T. S. Eliot" },

            // Steve Jobs

            { text: "A lot of people in our industry haven't had very diverse experiences. So they don't have enough dots to connect, and they end up with very linear solutions without a broad perspective on the problem. The broader one's understanding of the human experience, the better design we will have.", author: "Steve Jobs" },
            { text: "Almost everything...all external expectations...all pride...all fear of embarrassment or failure...these things just fall away in the face of death....leaving only what is truly important. Remembering that you are going to die is the best way I know to avoid the trap of thinking that you have something to lose. You are already naked...there is no reason not to follow your heart.", author: "Steve Jobs" },
            { text: "At Apple, people are putting in 18-hour days. We attract a different type of person—a person who doesn’t want to wait five or ten years to have someone take a giant risk on him or her. Someone who really wants to get in a little over his head and make a little dent in the universe. We are aware that we are doing something significant. We’re here at the beginning of it and we’re able to shape how it goes. Everyone here has the sense that right now is one of those moments when we are influencing the future.", author: "Steve Jobs" },
            { text: "Be a yardstick of quality. Some people aren't used to an environment where excellence is expected.", author: "Steve Jobs" },
            { text: "Being the richest man in the cemetery doesn't matter to me. Going to bed at night saying we've done something wonderful... that's what matters to me.", author: "Steve Jobs" },
            { text: "But innovation comes from people meeting up in the hallways or calling each other at 10:30 at night with a new idea, or because they realized something that shoots holes in how we’ve been thinking about a problem.", author: "Steve Jobs" },
