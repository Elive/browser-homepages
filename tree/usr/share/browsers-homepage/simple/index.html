            { text: "You can’t have good ideas unless you’re willing to generate a lot of bad ones.", author: "Seth Godin" },

            // Shunryu Suzuki
            { text: "In the beginner’s mind there are many possibilities; in the expert’s mind there are few.", author: "Shunryu Suzuki" },

            // Stephenie Meyer

            // Suzanne Collins
            { text: "You don’t forget the face of the person who was your last hope.", author: "Suzanne Collins" },
            { text: "You love me. Real or not real?\" I tell him, \"Real.", author: "Suzanne Collins" },

            // Sylvia Plath
            { text: "I can never read all the books I want; I can never be all the people I want and live all the lives I want. I can never train myself in all the skills I want. And why do I want? I want to live and feel all the shades, tones and variations of mental and physical experience possible in my life. And I am horribly limited.", author: "Sylvia Plath" },

            // Stephen Covey
            { text: "All things are created twice. There’s a mental or first creation, and a physical or second creation to all things", author: "Stephen Covey" },

            // Stephen Jay Gould
            { text: "Nothing is more dangerous than a dogmatic worldview – nothing more constraining, more blinding to innovation, more destructive of openness to novelty.", author: "Stephen Jay Gould" },

            // Stephen Nachmanovitch
            { text: "The most potent muse of all is our own inner child.", author: "Stephen Nachmanovitch" },

            // Stephen Chbosky
            { text: "So, this is my life. And I want you to know that I am both happy and sad and I'm still trying to figure out how that could be.", author: "Stephen Chbosky" },
            { text: "We accept the love we think we deserve.", author: "Stephen Chbosky" },
            { text: "Things change. And friends leave. Life doesn't stop for anybody.", author: "Stephen Chbosky" },

            // Steve Martin
            { text: "A day without sunshine is like, you know, night.", author: "Steve Martin" },

            // Nikola Tesla
            { text: "A new idea must not be judged by its immediate results.", author: "Nikola Tesla" },
            { text: "A new world must be born, a world that would justify the sacrifices offered by humanity. This new world must be a world in which there shall be no exploitation of the weak by the strong, of the good by the evil; where there will be no humiliation of the poor by the violence of the rich; where the products of intellect, science and art will serve society for the betterment and beautification of life, and not the individuals for achieving wealth. This new world shall not be a world of the downtrodden and humiliated, but of free men and free nations, equal in dignity and respect.", author: "Nikola Tesla" },
            { text: "All perceptible matter comes from a primary substance, or tenuity beyond conception, filling all space, the akasha or luminiferous ether, which is acted upon by the life giving Prana or creative force, calling into existence, in never-ending cycles all things and phenomena.", author: "Nikola Tesla" },
            { text: "All that was great in the past was ridiculed, condemned, combated, suppressed — only to emerge all the more powerfully, all the more triumphantly from the struggle.", author: "Nikola Tesla" },
            { text: "Anti-social behavior is a trait of intelligence in a world full of conformists", author: "Nikola Tesla" },
            { text: "As I review the events of my past life I realize how subtle are the influences that shape our destinies.", author: "Nikola Tesla" },
            { text: "Be alone, that is the secret of invention; be alone, that is when ideas are born.", author: "Nikola Tesla" },
            { text: "But instinct is something which transcends knowledge. We have, undoubtedly, certain finer fibers that enable us to perceive truths when logical deduction, or any other willful effort of the brain, is futile.", author: "Nikola Tesla" },
            { text: "Einstein's relativity work is a magnificent mathematical garb which fascinates, dazzles and makes people blind to the underlying errors. The theory is like a beggar clothed in purple whom ignorant people take for a king... its exponents are brilliant men but they are metaphysicists rather than scientists.", author: "Nikola Tesla" },
            { text: "Every living being is an engine geared to the wheelwork of the universe. Though seemingly affected only by its immediate surrounding, the sphere of external influence extends to infinite distance.", author: "Nikola Tesla" },
            { text: "Everyone should consider his body as a priceless gift from one whom he loves above all, a marvelous work of art, of indescribable beauty, and mystery beyond human conception, and so delicate that a word, a breath, a look, nay, a thought may injure it.", author: "Nikola Tesla" },
            { text: "Fights between individuals, as well as governments and nations, invariably result from misunderstandings in the broadest interpretation of this term. Misunderstandings are always caused by the inability of appreciating one another's point of view. This again is due to the ignorance of those concerned, not so much in their own, as in their mutual fields. The peril of a clash is aggravated by a more or less predominant sense of combativeness, posed by every human being. To resist this inherent fighting tendency the best way is to dispel ignorance of the doings of others by a systematic spread of general knowledge. With this object in view, it is most important to aid exchange of thought and intercourse.", author: "Nikola Tesla" },
            { text: "Great moments are born from great opportunity.", author: "Nikola Tesla" },
            { text: "I am credited with being one of the hardest workers and perhaps I am, if thought is the equivalent of labour, for I have devoted to it almost all of my waking hours. But if work is interpreted to be a definite performance in a specified time according to a rigid rule, then I may be the worst of idlers.", author: "Nikola Tesla" },
            { text: "I do not think there is any thrill that can go through the human heart like that felt by the inventor as he sees some creation of the brain unfolding to success . . . Such emotions make a man forget food, sleep, friends, love, everything.", author: "Nikola Tesla" },
            { text: "I do not think you can name many great inventions that have been made by married men.", author: "Nikola Tesla" },
            { text: "I don't care that they stole my ideas... I care that they don't have any of their own.", author: "Nikola Tesla" },
            { text: "I had a veritable mania for finishing whatever I began, which often got me into difficulties. On one occasion I started to read the works of Voltaire when I learned, to my dismay, that there were close on one hundred large volumes in small print which that monster had written while drinking seventy-two cups of black coffee per diem. It had to be done, but when I laid aside the last book I was very glad, and said, “Never more!", author: "Nikola Tesla" },
            { text: "I hold that space cannot be curved, for the simple reason that it can have no properties. It might as well be said that God has properties. He has not, but only attributes and these are of our own making. Of properties we can only speak when dealing with matter filling the space. To say that in the presence of large bodies space becomes curved is equivalent to stating that something can act upon nothing. I, for one, refuse to subscribe to such a view.", author: "Nikola Tesla" },
            { text: "If you want to find the secrets of the universe, think in terms of energy, frequency and vibration.", author: "Nikola Tesla" },
            { text: "If your hate could be turned into electricity, it would light up the whole world.", author: "Nikola Tesla" },
            { text: "Invention is the most important product of man's creative brain. The ultimate purpose is the complete mastery of mind over the material world, the harnessing of human nature to human needs.", author: "Nikola Tesla" },
            { text: "Inventors don't have time for married life.", author: "Nikola Tesla" },
            { text: "It is not in the shallow physical imitation of men that women will assert first their equality and later their superiority, but in the awakening of the intellect of women.", author: "Nikola Tesla" },
            { text: "It's not the love you make. It's the love you give.", author: "Nikola Tesla" },
            { text: "Let the future tell the truth, and evaluate each one according to his work and accomplishments. The present is theirs; the future, for which I have really worked, is mine", author: "Nikola Tesla" },
            { text: "Life is and will ever remain an equation incapable of solution, but it contains certain known factors.", author: "Nikola Tesla" },
            { text: "Marconi is a good fellow. Let him continue. He is using seventeen of my patents.", author: "Nikola Tesla" },
            { text: "Most persons are so absorbed in the contemplation of the outside world that they are wholly oblivious to what is passing on within themselves.", author: "Nikola Tesla" },
            { text: "My brain is only a receiver, in the Universe there is a core from which we obtain knowledge, strength and inspiration. I have not penetrated into the secrets of this core, but I know that it exists.", author: "Nikola Tesla" },
            { text: "My method is different. I do not rush into actual work. When I get an idea I start at once building it up in my imagination. I change the construction, make improvements, and operate the device entirely in my mind.", author: "Nikola Tesla" },
            { text: "Nature may reach the same result in many ways. Like a wave in the physical world, in the infinite ocean of the medium which pervades all, so in the world of organisms, in life, an impulse started proceeds onward, at times, may be, with the speed of light, at times, again, so slowly that for ages and ages it seems to stay, passing through processes of a complexity inconceivable to men, but in all its forms, in all its stages, its energy ever and ever integrally present. A single ray of light from a distant star falling upon the eye of a tyrant in bygone times may have altered the course of his life, may have changed the destiny of nations, may have transformed the surface of the globe, so intricate, so inconceivably complex are the processes in Nature. In no way can we get such an overwhelming idea of the grandeur of Nature than when we consider, that in accordance with the law of the conservation of energy, throughout the Infinite, the forces are in a perfect balance, and hence the energy of a single thought may determine the motion of a universe.", author: "Nikola Tesla" },
            { text: "Of all things, I liked books best.", author: "Nikola Tesla" },
            { text: "One has to be sane to think clearly, but one can think deeply and be quite insane", author: "Nikola Tesla" },
            { text: "Our virtues and our failings are inseparable, like force and matter. When they separate, man is no more", author: "Nikola Tesla" },
            { text: "Peace can only come as a natural consequence of universal enlightenment and merging of races, and we are still far from this blissful realization.", author: "Nikola Tesla" },
            { text: "Science is opposed to theological dogmas because science is founded on fact. To me, the universe is simply a great machine which never came into being and never will end. The human being is no exception to the natural order. Man, like the universe, is a machine. Nothing enters our minds or determines our actions which is not directly or indirectly a response to stimuli beating upon our sense organs from without. Owing to the similarity of our construction and the sameness of our environment, we respond in like manner to similar stimuli, and from the concordance of our reactions, understanding is born. In the course of ages, mechanisms of infinite complexity are developed, but what we call 'soul' or 'spirit,' is nothing more than the sum of the functionings of the body. When this functioning ceases, the 'soul' or the 'spirit' ceases likewise.", author: "Nikola Tesla" },
            { text: "So astounding are the facts in this connection, that it would seem as though the Creator, himself had electrically designed this planet...", author: "Nikola Tesla" },
            { text: "So we find that the three possible solutions of the great problem of increasing human energy are answered by the three words: food, peace, work. Many a year I have thought and pondered, lost myself in speculations and theories, considering man as a mass moved by a force, viewing his inexplicable movement in the light of a mechanical one, and applying the simple principles of mechanics to the analysis of the same until I arrived at these solutions, only to realize that they were taught to me in my early childhood. These three words sound the key-notes of the Christian religion. Their scientific meaning and purpose now clear to me: food to increase the mass, peace to diminish the retarding force, and work to increase the force accelerating human movement. These are the only three solutions which are possible of that great problem, and all of them have one object, one end, namely, to increase human energy. When we recognize this, we cannot help wondering how profoundly wise and scientific and how immensely practical the Christian religion is, and in what a marked contrast it stands in this respect to other religions. It is unmistakably the result of practical experiment and scientific observation which have extended through the ages, while other religions seem to be the outcome of merely abstract reasoning. Work, untiring effort, useful and accumulative, with periods of rest and recuperation aiming at higher efficiency, is its chief and ever-recurring command. Thus we are inspired both by Christianity and Science to do our utmost toward increasing the performance of mankind. This most important of human problems I shall now specifically consider.", author: "Nikola Tesla" },
            { text: "The day science begins to study non-physical phenomena, it will make more progress in one decade than in all the previous centuries of its existence.", author: "Nikola Tesla" },
            { text: "The gift of mental power comes from God, Divine Being, and if we concentrate our minds on that truth, we become in tune with this great power. My Mother had taught me to seek all truth in the Bible.", author: "Nikola Tesla" },
            { text: "Today the most civilized countries of the world spend a maximum of their income on war and a minimum on education. The twenty-first century will reverse this order. It will be more glorious to fight against ignorance than to die on the field of battle. The discovery of a new scientific truth will be more important than the squabbles of diplomats. Even the newspapers of our own day are beginning to treat scientific discoveries and the creation of fresh philosophical concepts as news. The newspapers of the twenty-first century will give a mere 'stick' in the back pages to accounts of crime or political controversies, but will headline on the front pages the proclamation of a new scientific hypothesis. Progress along such lines will be impossible while nations persist in the savage practice of killing each other off. I inherited from my father, an erudite man who labored hard for peace, an ineradicable hatred of war.", author: "Nikola Tesla" },

            // Nelson Mandela
            { text: "The greatest glory in living lies not in never falling, but in rising every time we fall.", author: "Nelson Mandela" },

            // Oscar Wilde
            { text: "A bore is someone who deprives you of solitude without providing you with company.", author: "Oscar Wilde" },
            { text: "A cynic is a man who knows the price of everything, and the value of nothing.", author: "Oscar Wilde" },
            { text: "A good friend will always stab you in the front.", author: "Oscar Wilde" },
            { text: "A little sincerity is a dangerous thing, and a great deal of it is absolutely fatal.", author: "Oscar Wilde" },
            { text: "A man can be happy with any woman as long as he does not love her.", author: "Oscar Wilde" },
            { text: "A man who does not think for himself does not think at all.", author: "Oscar Wilde" },
            { text: "A thing is not necessarily true because a man dies for it.", author: "Oscar Wilde" },
            { text: "After a good dinner one can forgive anybody, even one's own relations.", author: "Oscar Wilde" },
            { text: "All art is quite useless.", author: "Oscar Wilde" },
            { text: "All women become like their mothers. That is their tragedy. No man does, and that is his.", author: "Oscar Wilde" },
            { text: "Always forgive your enemies; nothing annoys them so much.", author: "Oscar Wilde" },
            { text: "Always! That is a dreadful word. It makes me shudder when I hear it. Women are so fond of using it. They spoil every romance by trying to make it last forever. It is a meaningless word, too. The only difference between a caprice and a life-long passion is that the caprice lasts a little longer.", author: "Oscar Wilde" },
            { text: "America is the only country that went from barbarism to decadence without civilization in between.", author: "Oscar Wilde" },
            { text: "An idea that is not dangerous is unworthy of being called an idea at all.", author: "Oscar Wilde" },
            { text: "Anybody can sympathise with the sufferings of a friend, but it requires a very fine nature to sympathise with a friend's success.", author: "Oscar Wilde" },
            { text: "Anyone who lives within their means suffers from a lack of imagination.", author: "Oscar Wilde" },
            { text: "Art is the only serious thing in the world. And the artist is the only person who is never serious.", author: "Oscar Wilde" },
            { text: "Be yourself; everyone else is already taken.", author: "Oscar Wilde" },
            { text: "Beauty is the only thing that time cannot harm. Philosophies fall away like sand, creeds follow one another, but what is beautiful is a joy for all seasons, a possession for all eternity.", author: "Oscar Wilde" },
            { text: "Because to influence a person is to give him one's own soul. He does not think his natural thoughts, or burn with his natural passions. His virtues are not real to him. His sins, if there are such things as sins, are borrowed. He becomes an echo of some one else's music, an actor of a part that has not been written for him. The aim of life is self-development. To realize one's nature perfectly -- that is what each of us is here for. People are afraid of themselves, nowadays. They have forgotten the highest of all duties, the duty that one owes to oneself. Of course they are charitable. They feed the hungry, and clothe the beggar. But their own souls starve, and are naked. Courage has gone out of our race. Perhaps we never really had it. The terror of society, which is the basis of morals, the terror of God, which is the secret of religion -- these are the two things that govern us.", author: "Oscar Wilde" },
            { text: "Behind every exquisite thing that existed, there was something tragic.", author: "Oscar Wilde" },
            { text: "Between men and women there is no friendship possible. There is passion, enmity, worship, love, but no friendship.", author: "Oscar Wilde" },
            { text: "Children begin by loving their parents; as they grow older they judge them; sometimes they forgive them.", author: "Oscar Wilde" },
            { text: "Consistency is the hallmark of the unimaginative.", author: "Oscar Wilde" },
            { text: "Death must be so beautiful. To lie in the soft brown earth, with the grasses waving above one's head, and listen to silence. To have no yesterday, and no tomorrow. To forget time, to forgive life, to be at peace.", author: "Oscar Wilde" },
            { text: "Disobedience, in the eyes of any one who has read history, is man's original virtue. It is through disobedience that progress has been made, through disobedience and through rebellion.", author: "Oscar Wilde" },
            { text: "Education is an admirable thing, but it is well to remember from time to time that nothing that is worth knowing can be taught.", author: "Oscar Wilde" },
            { text: "Every portrait that is painted with feeling is a portrait of the artist, not of the sitter.", author: "Oscar Wilde" },
            { text: "Every saint has a past, and every sinner has a future.", author: "Oscar Wilde" },
            { text: "Every woman is a rebel.", author: "Oscar Wilde" },
            { text: "Everything in moderation, including moderation.", author: "Oscar Wilde" },
            { text: "Everything in the world is about sex except sex. Sex is about power.", author: "Oscar Wilde" },
            { text: "Everything popular is wrong.", author: "Oscar Wilde" },
            { text: "Experience is merely the name men gave to their mistakes.", author: "Oscar Wilde" },
            { text: "Fashion is a form of ugliness so intolerable that we have to alter it every six months.", author: "Oscar Wilde" },
            { text: "Friendship is far more tragic than love. It lasts longer.", author: "Oscar Wilde" },
            { text: "Genius is born—not paid.", author: "Oscar Wilde" },
            { text: "Give a man a mask and he will show his true face.", author: "Oscar Wilde" },
            { text: "He has no enemies, but is intensely disliked by his friends.", author: "Oscar Wilde" },
            { text: "Hear no evil, speak no evil, and you won't be invited to cocktail parties.", author: "Oscar Wilde" },
            { text: "Hearts are made to be broken.", author: "Oscar Wilde" },
            { text: "How can a woman be expected to be happy with a man who insists on treating her as if she were a perfectly normal human being", author: "Oscar Wilde" },
            { text: "Humanity takes itself too seriously. It is the world's original sin. If the cave-man had known how to laugh, History would have been different.", author: "Oscar Wilde" },
            { text: "I always pass on good advice. It is the only thing to do with it. It is never of any use to oneself.", author: "Oscar Wilde" },
            { text: "I am not young enough to know everything.", author: "Oscar Wilde" },
            { text: "I am so clever that sometimes I don't understand a single word of what I am saying.", author: "Oscar Wilde" },
            { text: "I am tired of myself tonight. I should like to be somebody else.", author: "Oscar Wilde" },
            { text: "I am too fond of reading books to care to write them.", author: "Oscar Wilde" },
            { text: "I can resist anything except temptation.", author: "Oscar Wilde" },
            { text: "I choose my friends for their good looks, my acquaintances for their good characters, and my enemies for their good intellects.", author: "Oscar Wilde" },
            { text: "I don't like compliments, and I don't see why a man should think he is pleasing a woman enormously when he says to her a whole heap of things that he doesn't mean.", author: "Oscar Wilde" },
            { text: "I don't want to be at the mercy of my emotions. I want to use them, to enjoy them, and to dominate them.", author: "Oscar Wilde" },
            { text: "I don’t say we all ought to misbehave. But we ought to look as if we could", author: "Oscar Wilde" },
            { text: "I don’t want to go to heaven. None of my friends are there.", author: "Oscar Wilde" },
            { text: "I hate people who are not serious about meals. It is so shallow of them.", author: "Oscar Wilde" },
            { text: "I have grown to love secrecy. It seems to be the one thing that can make modern life mysterious or marvelous to us. The commonest thing is delightful if only one hides it.", author: "Oscar Wilde" },
            { text: "I have nothing to declare except my genius.", author: "Oscar Wilde" },
            { text: "I have the simplest tastes. I am always satisfied with the best.", author: "Oscar Wilde" },
            { text: "I hope you have not been leading a double life, pretending to be wicked and being good all the time. That would be hypocrisy.", author: "Oscar Wilde" },
            { text: "I knew nothing but shadows and I thought them to be real.", author: "Oscar Wilde" },
            { text: "I like men who have a future and women who have a past.", author: "Oscar Wilde" },
            { text: "I like persons better than principles, and I like persons with no principles better than anything else in the world.", author: "Oscar Wilde" },
            { text: "I love acting. It is so much more real than life.", author: "Oscar Wilde" },
            { text: "I may not agree with you, but I will defend to the death your right to make an ass of yourself.", author: "Oscar Wilde" },
            { text: "I never put off till tomorrow what I can possibly do - the day after.", author: "Oscar Wilde" },
            { text: "I never travel without my diary. One should always have something sensational to read in the train.", author: "Oscar Wilde" },
            { text: "I really don't see anything romantic in proposing. It is very romantic to be in love. But there is nothing romantic about a definite proposal. Why, one may be accepted. One usually is, I believe. Then the excitement is all over. The very essence of romance is uncertainty. If ever I get married, I'll certainly try to forget the fact.", author: "Oscar Wilde" },
            { text: "I think God, in creating man, somewhat overestimated his ability.", author: "Oscar Wilde" },
            { text: "If I am occasionally a little over-dressed, I make up for it by being always immensely over-educated.", author: "Oscar Wilde" },
            { text: "If one cannot enjoy reading a book over and over again, there is no use in reading it at all.", author: "Oscar Wilde" },
            { text: "If you are not long, I will wait for you all my life.", author: "Oscar Wilde" },
            { text: "If you want to be a grocer, or a general, or a politician, or a judge, you will invariably become it; that is your punishment. If you never know what you want to be, if you live what some might call the dynamic life but what I will call the artistic life, if each day you are unsure of who you are and what you know you will never become anything, and that is your reward.", author: "Oscar Wilde" },
            { text: "If you want to tell people the truth, make them laugh, otherwise they’ll kill you.", author: "Oscar Wilde" },
            { text: "Illusion is the first of all pleasures.", author: "Oscar Wilde" },
            { text: "Imitation is the sincerest form of flattery that mediocrity can pay to greatness.", author: "Oscar Wilde" },
            { text: "In this world there are only two tragedies. One is not getting what one wants, and the other is getting it.", author: "Oscar Wilde" },
            { text: "Indeed I have always been of the opinion that hard work is simply the refuge of people who have nothing to do.", author: "Oscar Wilde" },
            { text: "Irony is wasted on the stupid", author: "Oscar Wilde" },
            { text: "It is absurd to divide people into good and bad. People are either charming or tedious.", author: "Oscar Wilde" },
            { text: "It is only shallow people who do not judge by appearances. The true mystery of the world is the visible, not the invisible....", author: "Oscar Wilde" },
            { text: "It is what you read when you don't have to that determines what you will be when you can't help it.", author: "Oscar Wilde" },
            { text: "Keep love in your heart. A life without it is like a sunless garden when the flowers are dead. The consciousness of loving and being loved brings a warmth and a richness to life that nothing else can bring.", author: "Oscar Wilde" },
            { text: "Laughter is not at all a bad beginning for a friendship, and it is by far the best ending for one.", author: "Oscar Wilde" },
            { text: "Life has been your art. You have set yourself to music. Your days are your sonnets.", author: "Oscar Wilde" },
            { text: "Life is far too important a thing ever to talk seriously about.", author: "Oscar Wilde" },
            { text: "Life is never fair, and perhaps it is a good thing for most of us that it is not.", author: "Oscar Wilde" },
            { text: "Life is too short to learn German", author: "Oscar Wilde" },
            { text: "Live! Live the wonderful life that is in you! Let nothing be lost upon you. Be always searching for new sensations. Be afraid of nothing.", author: "Oscar Wilde" },
            { text: "Man is least himself when he talks in his own person. Give him a mask, and he will tell you the truth.", author: "Oscar Wilde" },
            { text: "Men always want to be a woman’s first love. That is their clumsy vanity. We women have a more subtle instinct about these things. What (women) like is to be a man’s last romance.", author: "Oscar Wilde" },
            { text: "Morality is simply the attitude we adopt towards people we personally dislike.", author: "Oscar Wilde" },
            { text: "Most people are other people. Their thoughts are someone else’s opinions, their lives a mimicry, their passions a quotation.", author: "Oscar Wilde" },
            { text: "Music makes one feel so romantic - at least it always gets on one's nerves - which is the same thing nowadays.", author: "Oscar Wilde" },
            { text: "Never love anyone who treats you like you're ordinary.", author: "Oscar Wilde" },
            { text: "Never marry at all, Dorian. Men marry because they are tired, women, because they are curious: both are disappointed.", author: "Oscar Wilde" },
            { text: "Never regret thy fall,\nO Icarus of the fearless flight\nFor the greatest tragedy of them all\nIs never to feel the burning light.", author: "Oscar Wilde" },
            { text: "No good deed goes unpunished.", author: "Oscar Wilde" },
            { text: "No man is rich enough to buy back his past.", author: "Oscar Wilde" },
            { text: "Nothing can cure the soul but the senses, just as nothing can cure the senses but the soul.", author: "Oscar Wilde" },
            { text: "Nowadays most people die of a sort of creeping common sense, and discover when it is too late that the only things one never regrets are one's mistakes.", author: "Oscar Wilde" },
            { text: "Nowadays people know the price of everything and the value of nothing.", author: "Oscar Wilde" },
            { text: "One can always be kind to people about whom one cares nothing.", author: "Oscar Wilde" },
            { text: "One should always be in love. That's the reason one should never marry.", author: "Oscar Wilde" },
            { text: "One should always play fairly when one has the winning cards.", author: "Oscar Wilde" },
            { text: "One should never trust a woman who tells one her real age. A woman who would tell one that would tell one anything.", author: "Oscar Wilde" },
            { text: "Only dull people are brilliant at breakfast.", author: "Oscar Wilde" },
            { text: "Only the shallow know themselves", author: "Oscar Wilde" },
            { text: "Ordinary riches can be stolen; real riches cannot. In your soul are infinitely precious things that cannot be taken from you.", author: "Oscar Wilde" },
            { text: "Paradoxically though it may seem, it is none the less true that life imitates art far more than art imitates life.", author: "Oscar Wilde" },
            { text: "Punctuality is the thief of time", author: "Oscar Wilde" },
            { text: "Quotation is a serviceable substitute for wit.", author: "Oscar Wilde" },
            { text: "Selfishness is not living as one wishes to live, it is asking others to live as one wishes to live.", author: "Oscar Wilde" },
            { text: "She behaves as if she was beautiful. Most American women do. It is the secret of their charm.", author: "Oscar Wilde" },
            { text: "She is all the great heroines of the world in one. She is more than an individual. I love her, and I must make her love me. I want to make Romeo jealous. I want the dead lovers of the world to hear our laughter, and grow sad. I want a breath of our passion to stir dust into consciousness, to wake their ashes into pain.", author: "Oscar Wilde" },
            { text: "She is very clever, too clever for a woman. She lacks the indefinable charm of weakness.", author: "Oscar Wilde" },
            { text: "Society often forgives the criminal; it never forgives the dreamer.", author: "Oscar Wilde" },
            { text: "Some cause happiness wherever they go; others whenever they go.", author: "Oscar Wilde" },
            { text: "Some things are more precious because they don't last long.", author: "Oscar Wilde" },
            { text: "The basis of optimism is sheer terror.", author: "Oscar Wilde" },
            { text: "The books that the world calls immoral are books that show the world its own shame.", author: "Oscar Wilde" },
            { text: "The good ended happily, and the bad unhappily. That is what Fiction means.", author: "Oscar Wilde" },
            { text: "The most terrible thing about it is not that it breaks one’s heart—hearts are made to be broken—but that it turns one’s heart to stone.", author: "Oscar Wilde" },
            { text: "The mystery of love is greater than the mystery of death.", author: "Oscar Wilde" },
            { text: "The nicest feeling in the world is to do a good deed anonymously-and have somebody find out.", author: "Oscar Wilde" },
            { text: "The old believe everything, the middle-aged suspect everything, the young know everything.", author: "Oscar Wilde" },
            { text: "The one charm about the past is that it is the past.", author: "Oscar Wilde" },
            { text: "The only artists I have ever known who are personally delightful are bad artists. Good artists exist simply in what they make, and consequently are perfectly uninteresting in what they are. A great poet, a really great poet, is the most unpoetical of all creatures. But inferior poets are absolutely fascinating. The worse their rhymes are, the more picturesque they look. The mere fact of having published a book of second-rate sonnets makes a man quite irresistible. He lives the poetry that he cannot write. The others write the poetry that they dare not realize.", author: "Oscar Wilde" },
            { text: "The only way to get rid of a temptation is to yield to it. Resist it, and your soul grows sick with longing for the things it has forbidden to itself, with desire for what its monstrous laws have made monstrous and unlawful.", author: "Oscar Wilde" },
            { text: "The only way to get rid of temptation is to yield to it.", author: "Oscar Wilde" },
            { text: "The public have an insatiable curiosity to know everything, except what is worth knowing.", author: "Oscar Wilde" },
            { text: "The public is wonderfully tolerant. It forgives everything except genius.", author: "Oscar Wilde" },
            { text: "The suspense is terrible. I hope it will last.", author: "Oscar Wilde" },
            { text: "The truth is rarely pure and never simple.", author: "Oscar Wilde" },
            { text: "The very essence of romance is uncertainty.", author: "Oscar Wilde" },
            { text: "The world is a stage and the play is badly cast.", author: "Oscar Wilde" },
            { text: "The world is changed because you are made of ivory and gold. The curves of your lips rewrite history.", author: "Oscar Wilde" },
            { text: "The world was my oyster but I used the wrong fork.", author: "Oscar Wilde" },
            { text: "There are many things that we would throw away if we were not afraid that others might pick them up.", author: "Oscar Wilde" },
            { text: "There are moments when one has to choose between living one's own life, fully, entirely, completely-or dragging out some false, shallow, degrading existence that the world in its hypocrisy demands.", author: "Oscar Wilde" },
            { text: "There are only two kinds of people who are really fascinating: people who know absolutely everything, and people who know absolutely nothing.", author: "Oscar Wilde" },
            { text: "There is a luxury in self-reproach. When we blame ourselves, we feel that no one else has a right to blame us. It is the confession, not the priest, that gives us absolution.", author: "Oscar Wilde" },
            { text: "There is no sin except stupidity.", author: "Oscar Wilde" },
            { text: "There is no such thing as a moral or an immoral book. Books are well written, or badly written. That is all.", author: "Oscar Wilde" },
            { text: "There is only one thing in the world worse than being talked about, and that is not being talked about.", author: "Oscar Wilde" },
            { text: "They get up early, because they have so much to do, and go to bed early, because they have so little to think about. ", author: "Oscar Wilde" },
            { text: "They've promised that dreams can come true - but forgot to mention that nightmares are dreams, too.", author: "Oscar Wilde" },
            { text: "This wallpaper is dreadful, one of us will have to go.", author: "Oscar Wilde" },
            { text: "Those who find ugly meanings in beautiful things are corrupt without being charming. This is a fault. Those who find beautiful meanings in beautiful things are the cultivated. For these there is hope.", author: "Oscar Wilde" },
            { text: "To define is to limit.", author: "Oscar Wilde" },
            { text: "To expect the unexpected shows a thoroughly modern intellect.", author: "Oscar Wilde" },
            { text: "To get back my youth I would do anything in the world, except take exercise, get up early, or be respectable.", author: "Oscar Wilde" },
            { text: "To live is the rarest thing in the world. Most people exist, that is all.", author: "Oscar Wilde" },
            { text: "To lose one parent, Mr. Worthing, may be regarded as a misfortune; to lose both looks like carelessness.", author: "Oscar Wilde" },
            { text: "To love oneself is the beginning of a lifelong romance.", author: "Oscar Wilde" },
            { text: "To regret one’s own experiences is to arrest one’s own development. To deny one’s own experiences is to put a lie into the lips of one’s own life. It is no less than a denial of the soul.", author: "Oscar Wilde" },
            { text: "We are all in the gutter, but some of us are looking at the stars.", author: "Oscar Wilde" },
            { text: "We are each our own devil, and we make this world our hell.", author: "Oscar Wilde" },
            { text: "We live in an age when unnecessary things are our only necessities.", author: "Oscar Wilde" },
            { text: "We women, as some one says, love with our ears, just as you men love with your eyes, if you ever love at all.", author: "Oscar Wilde" },
            { text: "When a woman marries again, it is because she detested her first husband. When a man marries again, it is because he adored his first wife. Women try their luck; men risk theirs.", author: "Oscar Wilde" },
            { text: "When one is in love, one always begins by deceiving one's self, and one always ends by deceiving others. That is what the world calls a romance.", author: "Oscar Wilde" },
            { text: "When the Gods wish to punish us, they answer our prayers.", author: "Oscar Wilde" },
            { text: "Whenever a man does a thoroughly stupid thing, it is always from the noblest motives.", author: "Oscar Wilde" },
            { text: "Whenever people agree with me I always feel I must be wrong.", author: "Oscar Wilde" },
            { text: "Who, being loved, is poor?", author: "Oscar Wilde" },
            { text: "With freedom, books, flowers, and the moon, who could not be happy?", author: "Oscar Wilde" },
            { text: "Women are meant to be loved, not to be understood.", author: "Oscar Wilde" },
            { text: "Women have a much better time than men in this world; there are far more things forbidden to them.", author: "Oscar Wilde" },
            { text: "Words! Mere words! How terrible they were! How clear, and vivid, and cruel! One could not escape from them. And yet what a subtle magic there was in them! They seemed to be able to give a plastic form to formless things, and to have a music of their own as sweet as that of viol or of lute. Mere words! Was there anything so real as words?", author: "Oscar Wilde" },
            { text: "Work is the curse of the drinking classes.", author: "Oscar Wilde" },
            { text: "Yes: I am a dreamer. For a dreamer is one who can only find his way by moonlight, and his punishment is that he sees the dawn before the rest of the world.", author: "Oscar Wilde" },
            { text: "Yet each man kills the thing he loves, By each let this be heard, Some do it with a bitter look, Some with a flattering word, The coward does it with a kiss, The brave man with a sword!", author: "Oscar Wilde" },
            { text: "You can never be overdressed or overeducated.", author: "Oscar Wilde" },
            { text: "You don't love someone for their looks, or their clothes, or for their fancy car, but because they sing a song only you can hear.", author: "Oscar Wilde" },
            { text: "You like every one; that is to say, you are indifferent to every one.", author: "Oscar Wilde" },
            { text: "You must have a cigarette. A cigarette is the perfect type of a perfect pleasure. It is exquisite, and it leaves one unsatisfied. What more can one want?", author: "Oscar Wilde" },
            { text: "You will always be fond of me. I represent to you all the sins you never had the courage to commit.", author: "Oscar Wilde" },
            { text: "“How you can sit there, calmly eating muffins when we are in this horrible trouble, I can’t make out. You seem to me to be perfectly heartless.\"\n\n\"Well, I can’t eat muffins in an agitated manner. The butter would probably get on my cuffs. One should always eat muffins quite calmly. It is the only way to eat them.\"\n\n\"I say it’s perfectly heartless your eating muffins at all, under the circumstances.”", author: "Oscar Wilde" },

            // Mozart
            { text: "Neither a lofty degree of intelligence, nor imagination, nor both together, go to the making of genius. Love, Love, Love. That is the soul of genius.", author: "Mozart" },

            // Osho
            { text: "A certain darkness is needed to see the stars.", author: "Osho" },
            { text: "A little foolishness, enough 2 enjoy life, & a little wisdom to avoid the errors, that will do", author: "Osho" },
            { text: "Always remember to judge everything by your inner feeling of bliss.", author: "Osho" },
            { text: "Be less of a judge and you will be surprised that when you become a witness and you don't judge yourself, you stop judging others too. And that makes you more human, more compassionate, more understanding.", author: "Osho" },
            { text: "Be realistic: Plan for a miracle", author: "Osho" },
            { text: "Be — don't try to become", author: "Osho" },
            { text: "Courage Is a Love Affair with the Unknown", author: "Osho" },
            { text: "Creativity is the greatest rebellion in existence.", author: "Osho" },
            { text: "Don't try to understand life. Live it! Don't try to understand love. Move into love. Then you will know - and all that knowing will come out of your experiencing. The more you know, the more you know that much remains to be known.", author: "Osho" },
            { text: "Drop the idea of becoming someone, because you are already a masterpiece. You cannot be improved. You have only to come to it, to know it, to realize it.", author: "Osho" },
            { text: "Each person comes into this world with a specific destiny--he has something to fulfill, some message has to be delivered, some work has to be completed. You are not here accidentally--you are here meaningfully. There is a purpose behind you. The whole intends to do something through you.", author: "Osho" },
            { text: "Experience life in all possible ways -- good-bad, bitter-sweet, dark-light, summer-winter. Experience all the dualities. Don't be afraid of experience, because the more experience you have, the more mature you become.", author: "Osho" },
            { text: "Falling in love you remain a child; rising in love you mature. By and by love becomes not a relationship, it becomes a state of your being. Not that you are in love - now you are love.", author: "Osho" },
            { text: "Fame is foolish, it is pointless, meaningless. Even if the whole world knows you, how does it make you richer? How does it make your life more blissful? How does it help you to be more understanding, to be more aware? To be more alert, to be more alive?", author: "Osho" },
            { text: "Find ecstasy within yourself. It is not out there. It is in your innermost flowering. The one you are looking for is you.", author: "Osho" },
            { text: "Friendship is the purest love. It is the highest form of Love where nothing is asked for, no condition, where one simply enjoys giving.", author: "Osho" },
            { text: "I live my life based on 2 principles. One, I live as if today was my last day on earth. Two, I live today as if I am going to live forever.", author: "Osho" },
            { text: "I love, because my love is not dependent on the object of love. My love is dependent on my state of being. So whether the other person changes, becomes different, friend turns into a foe, does not matter, because my love was never dependent on the other person. My love is my state of being. I simply love.", author: "Osho" },
            { text: "I love this world because it is imperfect. It is imperfect, and that's why it is growing; if it was perfect it would have been dead. Growth is possible only if there is imperfection. I would like you to remember again and again, I am imperfect, the whole universe is imperfect, and to love this imperfection, to rejoice in this imperfection is my whole message.", author: "Osho" },
            { text: "I'm simply saying that there is a way to be sane. I'm saying that you can get rid of all this insanity created by the past in you. Just by being a simple witness of your thought processes. It is simply sitting silently, witnessing the thoughts, passing before you. Just witnessing, not interfering not even judging, because the moment you judge you have lost the pure witness. The moment you say “this is good, this is bad,” you have already jumped onto the thought process. It takes a little time to create a gap between the witness and the mind. Once the gap is there, you are in for a great surprise, that you are not the mind, that you are the witness, a watcher. And this process of watching is the very alchemy of real religion. Because as you become more and more deeply rooted in witnessing, thoughts start disappearing. You are, but the mind is utterly empty. That’s the moment of enlightenment. That is the moment that you become for the first time an unconditioned, sane, really free human being.", author: "Osho" },
            { text: "If you are a parent, open doors to unknown directions to the child so he can explore. Don't make him afraid of the unknown,give him support. ", author: "Osho" },
            { text: "If you love a flower, don’t pick it up. Because if you pick it up it dies and it ceases to be what you love. So if you love a flower, let it be. Love is not about possession. Love is about appreciation.", author: "Osho" },
            { text: "Immature people falling in love destroy each other’s freedom, create a bondage, make a prison. Mature persons in love help each other to be free; they help each other to destroy all sorts of bondages. And when love flows with freedom there is beauty. When love flows with dependence there is ugliness. A mature person does not fall in love, he or she rises in love. Only immature people fall; they stumble and fall down in love. Somehow they were managing and standing. Now they cannot manage and they cannot stand. They were always ready to fall on the ground and to creep. They don’t have the backbone, the spine; they don’t have the integrity to stand alone. A mature person has the integrity to stand alone. And when a mature person gives love, he or she gives without any strings attached to it. When two mature persons are in love, one of the great paradoxes of life happens, one of the most beautiful phenomena: they are together and yet tremendously alone. They are together so much that they are almost one. Two mature persons in love help each other to become more free. There is no politics involved, no diplomacy, no effort to dominate. Only freedom and love.", author: "Osho" },
            { text: "In love the other is important; in lust you are important", author: "Osho" },
            { text: "Intelligence is dangerous. Intelligence means you will start thinking on your own; you will start looking around on your own. You will not believe in the scriptures; you will believe only in your own experience.", author: "Osho" },
            { text: "Life begins where fear ends.", author: "Osho" },
            { text: "Listen to your being. It is continuously giving you hints; it is a still, small voice. It does not shout at you, that is true. And if you are a little silent you will start feeling your way. Be the person you are. Never try to be another, and you will become mature. Maturity is accepting the responsibility of being oneself, whatsoever the cost. Risking all to be oneself, that's what maturity is all about.", author: "Osho" },
            { text: "Many people have come and left, and it has been always good because they emptied some space for better people. It is a strange experience, that those who have left me have always left places for a better quality of people. I have never been a loser", author: "Osho" },
            { text: "Millions of people are suffering: they want to be loved but they don't know how to love. And love cannot exist as a monologue; it is a dialogue, a very harmonious dialogue. ", author: "Osho" },
            { text: "My meditation is simple. It does not require any complex practices. It is simple. It is singing. It is dancing. It is sitting silently", author: "Osho" },
            { text: "My whole teaching consists of two words, meditation and love. Meditate so that you can feel immense silence, and love so that your life can become a song, a dance, a celebration.", author: "Osho" },
            { text: "Nobody can say anything about you. Whatsoever people say is about themselves. But you become very shaky, because you are still clinging to a false center. That false center depends on others, so you are always looking to what people are saying about you. And you are always following other people, you are always trying to satisfy them. You are always trying to be respectable, you are always trying to decorate your ego. This is suicidal. Rather than being disturbed by what others say, you should start looking inside yourself… Whenever you are self-conscious you are simply showing that you are not conscious of the self at all. You don’t know who you are. If you had known, then there would have been no problem— then you are not seeking opinions. Then you are not worried what others say about you— it is irrelevant! When you are self-conscious you are in trouble. When you are self-conscious you are really showing symptoms that you don’t know who you are. Your very self-consciousness indicates that you have not come home yet.", author: "Osho" },
            { text: "Nobody has the power to take two steps together; you can take only one step at a time.", author: "Osho" },
            { text: "Nobody is superior, nobody is inferior, but nobody is equal either. People are simply unique, incomparable. You are you, I am I. I have to contribute my potential to life; you have to contribute your potential to life. I have to discover my own being; you have to discover your own being.", author: "Osho" },
            { text: "One just needs a little alertness to see and find out: Life is really a great cosmic laughter.", author: "Osho" },
            { text: "One thing: you have to walk, and create the way by your walking; you will not find a ready-made path. It is not so cheap, to reach to the ultimate realization of truth. You will have to create the path by walking yourself; the path is not ready-made, lying there and waiting for you. It is just like the sky: the birds fly, but they don't leave any footprints. You cannot follow them; there are no footprints left behind.", author: "Osho" },
            { text: "Sadness gives depth. Happiness gives height. Sadness gives roots. Happiness gives branches. Happiness is like a tree going into the sky, and sadness is like the roots going down into the womb of the earth. Both are needed, and the higher a tree goes, the deeper it goes, simultaneously. The bigger the tree, the bigger will be its roots. In fact, it is always in proportion. That's its balance.", author: "Osho" },
            { text: "Sadness is silent, it is yours. It is coming because you are alone. It is giving you a chance to go deeper into your aloneness. Rather than jumping from one shallow happiness to another shallow happiness and wasting your life, it is better to use sadness as a means for meditation. Witness it. It is a friend! It opens the door of your eternal aloneness.", author: "Osho" },
            { text: "Take hold of your own life. See that the whole existence is celebrating. These trees are not serious, these birds are not serious. The rivers and the oceans are wild, and everywhere there is fun, everywhere there is joy and delight. Watch existence, listen to the existence and become part of it.", author: "Osho" },
            { text: "That is the simple secret of happiness. Whatever you are doing, don’t let past move your mind; don’t let future disturb you. Because the past is no more, and the future is not yet. To live in the memories, to live in the imagination, is to live in the non-existential. And when you are living in the non-existential, you are missing that which is existential. Naturally you will be miserable, because you will miss your whole life.", author: "Osho" },
            { text: "The capacity to be alone is the capacity to love. It may look paradoxical to you, but it's not. It is an existential truth: only those people who are capable of being alone are capable of love, of sharing, of going into the deepest core of another person--without possessing the other, without becoming dependent on the other, without reducing the other to a thing, and without becoming addicted to the other. They allow the other absolute freedom, because they know that if the other leaves, they will be as happy as they are now. Their happiness cannot be taken by the other, because it is not given by the other.", author: "Osho" },
            { text: "The less people know, the more stubbornly they know it.", author: "Osho" },
            { text: "The moment a child is born, the mother is also born. She never existed before. The woman existed, but the mother, never. A mother is something absolutely new. and so in you the child your mother lives on and through your family continues to live... so at this time look after yourself and your family as you would your mother for through you all she will truly never die.", author: "Osho" },
            { text: "The real question is not whether life exists after death. The real question is whether you are alive before death.", author: "Osho" },
            { text: "They say: Think twice before you jump. I say: Jump first and then think as much as you want!", author: "Osho" },
            { text: "To avoid pain, they avoid pleasure. To avoid death, they avoid life.", author: "Osho" },
            { text: "To be creative means to be in love with life. You can be creative only if you love life enough that you want to enhance its beauty, you want to bring a little more music to it, a little more poetry to it, a little more dance to it.", author: "Osho" },
            { text: "Truth is not something outside to be discovered, it is something inside to be realized.", author: "Osho" },
            { text: "Truth is not to be found outside. No teacher, no scripture can give it to you. It is inside you and if you wish to attain it, seek your own company. Be with yourself. ", author: "Osho" },
            { text: "When I say be creative I don't mean that you should all go and become great painters and great poets. I simply mean let your life be a painting, let your life be a poem.", author: "Osho" },
            { text: "Whatever you feel, you become. It is your responsibility.", author: "Osho" },
            { text: "With me, illusions are bound to be shattered. I am here to shatter all illusions. Yes, it will irritate you, it will annoy you - that's my way of functioning and working. I will sabotage you from your very roots! Unless you are totally destroyed as a mind, there is no hope for you.", author: "Osho" },
            { text: "You feel good, you feel bad, and these feelings are bubbling from your own unconsciousness, from your own past. Nobody is responsible except you. Nobody can make you angry, and nobody can make you happy.", author: "Osho" },
            { text: "You have to be grateful to existence that it has chosen you to be a passage for a few beautiful children. But you are not to interfere in their growth, in their potential. You are not to impose yourself upon them. They are not going to live in the same times, they are not going to face the same problems. They will be part of another world. Don´t prepare them for this world, this society, this time, because then you will be creating troubles for them. They will find themselves unfit, unqualified.", author: "Osho" },
            { text: "Your whole idea about yourself is borrowed-- borrowed from those who have no idea of who they are themselves.", author: "Osho" },
            // Pablo
            { text: "No matter how old you are now. You are never too young or too old for success or going after what you want.", author: "Pablo" },

            // Pablo Neruda
            { text: "I love you without knowing how, or when, or from where. I love you simply, without problems or pride: I love you in this way because I do not know any other way of loving but this, in which there is no I or you, so intimate that your hand upon my chest is my hand, so intimate that when I fall asleep your eyes close.", author: "Pablo Neruda" },

            // U.G. Krishnamurti
            { text: "Nature is busy creating absolutely unique individuals, whereas culture has invented a single mold to which all must conform. It is grotesque.", author: "U.G. Krishnamurti" },

            // Patti Smith
            { text: "Without joy we are as dead... Find those who have it and bathe in their perfection.", author: "Patti Smith" },

            // Paulo Coelho
            { text: "And, when you want something, all the universe conspires in helping you to achieve it.", author: "Paulo Coelho" },

            // Padmasambhava
            { text: "Abandon your notions of the past, without attributing a temporal sequence! Cut off your mental associations regarding the future, without anticipation! Rest in a spacious modality, without clinging to [the thoughts of] the present. Do not meditate at all, since there is nothing upon which to meditate. Instead, revelation will come through undistracted mindfulness — Since there is nothing by which you can be distracted.", author: "Padmasambhava" },
            { text: "Agitation due to circumstances occurs when because of an external incident, you follow a thought, and your mind becomes agitated and scatters into a disturbing emotion. When that happens, keep the attitude of “There is no need to do anything!” Train in loving kindness and compassion, disenchantment, means and knowledge, and devotion. Following that, persevere in the practice as at the time of the view. That will clear it.", author: "Padmasambhava" },
            { text: "Are you oblivious to the sufferings of birth, old age, sickness and death? There is no guarantee that you will survive, even past this very day! The time has come [for you] to develop perseverance in [your] practice. For, at this singular opportunity, you could attain the everlasting bliss [of nirvāṇa]. So now is [certainly] not the time to sit idly, But, starting with [the reflection on] death, you should bring your practice to completion! The moments of our life are not expendable, And the [possible] circumstances of death are beyond imagination. If you do not achieve an undaunted confident security now, What point is there in your being alive, O living creature?", author: "Padmasambhava" },
            { text: "Associate with companions who are in harmony with the Dharma and who don't promote disturbing emotions. Keeping company with unwholesome friends, you cannot possibly avoid being influenced by their evil ways. That is the root of going astray...", author: "Padmasambhava" },
            { text: "Death holds up an all-seeing mirror, ‘the mirror of past actions’, to our eyes, in which the consequences of all our negative and positive actions are clearly seen and there is a weighing of our past actions in the light of their consequences, the balance of which will determine the kind of existence or mental state we are being driven to enter.", author: "Padmasambhava" },
            { text: "If you want to know your future life, look at your present actions. If you want to know your past life, look at your present condition.", author: "Padmasambhava" },
            { text: "If, upon looking outwards towards the external expanse of the sky, There are no projections emanated by the mind, And if, on looking inwards at one’s own mind, There is no projectionist who projects [thoughts] by thinking them, Then, one’s own mind, completely free from conceptual projections, will become luminously clear.", author: "Padmasambhava" },
            { text: "In modern science the methods of analysis are principally applied to investigating the nature of material entities. Thus, the ultimate nature of matter is sought through a reductive process and the macroscopic world is reduced to the microscopic world of particles. Yet, when the nature of these particles is further examined, we find that ultimately their very existence as objects is called into question.", author: "Padmasambhava" },
            { text: "In our own present world age, one thousand Buddhas will appear. Each one will be accompanied by an emanation of Guru Rinpoche to carry out the Buddha’s activities.", author: "Padmasambhava" },
            { text: "My father is wisdom and my mother is voidness. My country is the country of Dharma. I am of no caste and no creed. I am sustained by perplexity; and I am here to destroy lust, anger and sloth.", author: "Padmasambhava" },
            { text: "O, [you], with your mind far away, thinking that death will not come, Entranced by the pointless activities of this life, If you were to return empty-handed now, would not your [life’s] purpose have been [utterly] confused? Recognise what it is that you truly need! It is a sacred teaching [for liberation]! So, should you not practise this divine [sacred] teaching, beginning from this very moment?", author: "Padmasambhava" },
            { text: "Please guide all beings from this swamp of cyclic existence!", author: "Padmasambhava" },
            { text: "Transcendent renunciation is developed by meditating on the preciousness of human life in terms of the ocean of evolutionary possibilities, the immediacy of death, the inexorability of evolutionary causality, and the sufferings of the ignorance-driven, involuntary life cycle. Renunciation automatically occurs when you come face-to-face with your real existential situation, and so develop a genuine sympathy for yourself, having given up pretending the prison of habitual emotions and confusions is just fine.", author: "Padmasambhava" },
            { text: "You don’t have to be a philosopher; you just have to want to know who you are", author: "Padmasambhava" },

            // Paul Terry
            { text: "Whenever I feel the need to exercise, I lie down until it goes away.", author: "Paul Terry" },

            // Peter Drucker
            { text: "Because the purpose of business is to create a customer, the business enterprise has two–and only two–basic functions: marketing and innovation. Marketing and innovation produce results; all the rest are costs. Marketing is the distinguishing, unique function of the business.", author: "Peter Drucker" },
            { text: "Innovation is the specific instrument of entrepreneurship. The act that endows resources with a new capacity to create wealth.", author: "Peter Drucker" },
            { text: "Innovation opportunities do not come with the tempest but with the rustling of the breeze.", author: "Peter Drucker" },
            { text: "The best way to predict the future is to create it.", author: "Peter Drucker" },
            { text: "The enterprise that does not innovate ages and declines. And in a period of rapid change such as the present, the decline will be fast.", author: "Peter Drucker" },

            // J. Krishnamurti
            { text: "Do not repeat after me words that you do not understand. Do not merely put on a mask of my ideas, for it will be an illusion and you will thereby deceive yourself.", author: "J. Krishnamurti" },
            { text: "Freedom and love go together. Love is not a reaction. If I love you because you love me, that is mere trade, a thing to be bought in the market; it is not love. To love is not to ask anything in return, not even to feel that you are giving something- and it is only such love that can know freedom.", author: "J. Krishnamurti" },
            { text: "Governments want efficient technicians, not human beings, because human beings become dangerous to governments – and to organized religions as well. That is why governments and religious organizations seek to control education.", author: "J. Krishnamurti" },
            { text: "Happiness is strange; it comes when you are not seeking it. When you are not making an effort to be happy, then unexpectedly, mysteriously, happiness is there, born of purity, of a loveliness of being.", author: "J. Krishnamurti" },
            { text: "If you begin to understand what you are without trying to change it, then what you are undergoes a transformation.", author: "J. Krishnamurti" },
            { text: "It is no measure of health to be well adjusted to a profoundly sick society.", author: "J. Krishnamurti" },
            { text: "It is truth that liberates, not your effort to be free.", author: "J. Krishnamurti" },
            { text: "One is never afraid of the unknown; one is afraid of the known coming to an end.", author: "J. Krishnamurti" },
            { text: "Real learning comes about when the competitive spirit has ceased.", author: "J. Krishnamurti" },
            { text: "Tell your friend that in his death, a part of you dies and goes with him. Wherever he goes, you also go. He will not be alone.", author: "J. Krishnamurti" },
            { text: "The ability to observe without evaluating is the highest form of intelligence.", author: "J. Krishnamurti" },
            { text: "The constant assertion of belief is an indication of fear.", author: "J. Krishnamurti" },
            { text: "The more you know yourself, the more clarity there is. Self-knowledge has no end - you don't come to an achievement, you don't come to a conclusion. It is an endless river.", author: "J. Krishnamurti" },
            { text: "To understand the immeasurable, the mind must be extraordinarily quiet, still.", author: "J. Krishnamurti" },
            { text: "Tradition becomes our security, and when the mind is secure it is in decay.", author: "J. Krishnamurti" },
            { text: "When I understand myself, I understand you, and out of that understanding comes love. Love is the missing factor; there is a lack of affection, of warmth in relationship; and because we lack that love, that tenderness, that generosity, that mercy in relationship, we escape into mass action which produces further confusion, further misery.", author: "J. Krishnamurti" },
            { text: "When you call yourself an Indian or a Muslim or a Christian or a European, or anything else, you are being violent. Do you see why it is violent? Because you are separating yourself from the rest of mankind. When you separate yourself by belief, by nationality, by tradition, it breeds violence. So a man who is seeking to understand violence does not belong to any country, to any religion, to any political party or partial system; he is concerned with the total understanding of mankind.", author: "J. Krishnamurti" },
            { text: "You can only be afraid of what you think you know.", author: "J. Krishnamurti" },
            { text: "You know, if we understand one question rightly, all questions are answered. But we don't know how to ask the right question. To ask the right question demands a great deal of intelligence and sensitivity. Here is a question, a fundamental question: is life a torture? It is, as it is; and man has lived in this torture centuries upon centuries, from ancient history to the present day, in agony, in despair, in sorrow; and he doesn't find a way out of it. Therefore he invents gods, churches, all the rituals, and all that nonsense, or he escapes in different ways. What we are trying to do, during all these discussions and talks here, is to see if we cannot radically bring about a transformation of the mind, not accept things as they are, nor revolt against them. Revolt doesn't answer a thing. You must understand it, go into it, examine it, give your heart and your mind, with everything that you have, to find out a way of living differently. That depends on you, and not on someone else, because in this there is no teacher, no pupil; there is no leader; there is no guru; there is no Master, no Saviour. You yourself are the teacher and the pupil; you are the Master; you are the guru; you are the leader; you are everything. And to understand is to transform what is.", author: "J. Krishnamurti" },
            { text: "You must understand the whole of life, not just one little part of it. That is why you must read, that is why you must look at the skies, that is why you must sing, and dance, and write poems, and suffer, and understand, for all that is life.", author: "J. Krishnamurti" },
            { text: "A man who says, 'I want to change, tell me how to', seems very earnest, very serious, but he is not. He wants an authority whom he hopes will bring about order in himself. But can authority ever bring about inward order? Order imposed from without must always breed disorder.", author: "J. Krishnamurti" },
            { text: "Acquiring knowledge is a form of imitation.", author: "J. Krishnamurti" },
            { text: "Do you know that even when you look at a tree and say, `That is an oak tree', or `that is a banyan tree', the naming of the tree, which is botanical knowledge, has so conditioned your mind that the word comes between you and actually seeing the tree? To come in contact with the tree you have to put your hand on it and the word will not help you to touch it.", author: "J. Krishnamurti" },
            { text: "Do you want to know what my secret is? I don’t mind what happens.", author: "J. Krishnamurti" },
            { text: "do it or don't do it but get on with it...", author: "J. Krishnamurti" },
            { text: "Find out for yourself what are the possesions and ideals that you do not desire. By knowing what you do not want, by elimination, you will unburden the mind, and only then will it understand the essential which is ever there.", author: "J. Krishnamurti" },
            { text: "Follow the wandering, the distraction, find out why the mind has wandered; pursue it, go into it fully. When the distraction is completely understood, then that particular distraction is gone. When another comes, pursue it also.", author: "J. Krishnamurti" },
            { text: "I hope that you will listen, but not with the memory of what you already know; and this is very difficult to do. You listen to something, and your mind immediately reacts with its knowledge, its conclusions, its opinions, its past memories. It listens, inquiring for a future understanding. Just observe yourself, how you are listening, and you will see that this is what is taking place. Either you are listening with a conclusion, with knowledge, with certain memories, experiences, or you want an answer, and you are impatient. You want to know what it is all about, what life is all about, the extraordinary complexity of life. You are not actually listening at all. You can only listen when the mind is quiet, when the mind doesn't react immediately, when there is an interval between your reaction and what is being said. Then, in that interval there is a quietness, there is a silence in which alone there is a comprehension which is not intellectual understanding. If there is a gap between what is said and your own reaction to what is said, in that interval, whether you prolong it indefinitely, for a long period or for a few seconds - in that interval, if you observe, there comes clarity. It is the interval that is the new brain. The immediate reaction is the old brain, and the old brain functions in its own traditional, accepted, reactionary, animalistic sense. When there is an abeyance of that, when the reaction is suspended, when there is an interval, then you will find that the new brain acts, and it is only the new brain that can understand, not the old brain", author: "J. Krishnamurti" },
            { text: "I maintain that Truth is a pathless land, and you cannot approach it by any path whatsoever, by any religion, by any sect. ... The moment you follow someone you cease to follow Truth.", author: "J. Krishnamurti" },
            { text: "If we can really understand the problem, the answer will come out of it, because the answer is not separate from the problem.", author: "J. Krishnamurti" },
            { text: "If you lose touch with nature you lose touch with humanity. If there's no relationship with nature then you become a killer; then you kill baby seals, whales, dolphins, and man either for gain, for \"sport,\" for food, or for knowledge. Then nature is frightened of you, withdrawing its beauty. You may take long walks in the woods or camp in lovely places but you are a killer and so lose their friendship. You probably are not related to anything to your wife or your husband.", author: "J. Krishnamurti" },
            { text: "It is only when the mind is free from the old that it meets everything anew, and in that there is joy.", author: "J. Krishnamurti" },
            { text: "Passion is a rather frightening thing because if you have passion you don't know where it will take you.", author: "J. Krishnamurti" },
            { text: "The ending of sorrow is the beginning of wisdom. Knowledge is always within the shadow of ignorance. Meditation is freedom from thought and a movement in the ecstasy of truth. Meditation is explosion of intelligence.", author: "J. Krishnamurti" },
            { text: "Thought is so cunning, so clever, that it distorts everything for its own convenience.", author: "J. Krishnamurti" },
            { text: "To abandon all that is to be alone, and the mind that is alone is not only innocent but young -- not in time or age, but young, innocent, alive at whatever age -- and only such a mind can see that which is truth and that which is not measurable by words.", author: "J. Krishnamurti" },
            { text: "To be free of all authority, of your own and that of another, is to die to everything of yesterday, so that your mind is always fresh, always young, innocent, full of vigour and passion. It is only in that state that one learns and observes. And for this, a great deal of awareness is required, actual awareness of what is going on inside yourself, without correcting it or telling it what it should or should not be, because the moment you correct it you have established another authority, a censor.", author: "J. Krishnamurti" },
            { text: "To transform the world, we must begin with ourselves; and what is important in beginning with ourselves is the intention. The intention must be to understand ourselves and not to leave it to others to transform themselves or to bring about a modified change through revolution, either of the left or of the right. It is important to understand that this is our responsibility, yours and mine...", author: "J. Krishnamurti" },
            { text: "When you once see something as false which you have accepted as true, as natural, as human, then you can never go back to it.", author: "J. Krishnamurti" },

            // Jacque Fresco
            { text: "A lawyer is a guy who takes language, twists it around, to anyway he wants to. If he's skilled at it he can knock you out and put you in jail. A lawyer will be considered a criminal in the future. So would all bankers, and all businessman, and all politicians.", author: "Jacque Fresco" },
            { text: "A lot of people are brought up to believe that money is the driving force that generates incentive. It also generates incentive for corruption, embezzlement, taking care of your brother-in-law, unfair practices, racial discrimination, etc..", author: "Jacque Fresco" },
            { text: "A photograph of New York City, Chicago, L.A., or any city, shows every building is a different size, which means 'every man for himself', which means it's a selfish, self-centered culture. I don't need to ask what people are like in Chicago. I know by looking at the city and the fact that they tolerate what exists.", author: "Jacque Fresco" },
            { text: "A system that depends on the right man is a bad system.", author: "Jacque Fresco" },
            { text: "After thousands of people died, somebody jumped off a precipice and flew, and they called him the father of flight; which is dangerous. To me, there is no father of flight. There are no great minds; that all greats minds climb up on the backs of all the others that lived before them.", author: "Jacque Fresco" },
            { text: "All human behavior is lawful; that the reactions and values that all people have are perfectly lawful to the environment that they come from. Every human being is perfectly well-adjusted from where they are coming from, from their background and experience.", author: "Jacque Fresco" },
