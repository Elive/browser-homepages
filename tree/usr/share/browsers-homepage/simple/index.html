<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elive Homepage Search</title>
    <script src="tailwindcss.js"></script>
    <link href="fonts.css" rel="stylesheet">
    <style>
        :root {
            /* These will be set dynamically by JavaScript */
            --bg-primary: #e4e7eb;
            --bg-secondary: #f0f2f5;
            --fg-primary: #1f2937;
            --fg-secondary: #4b5563;
            --fg-muted: #6b7280;
            --accent: #334155;
            --accent-light: #475569;
            --accent-glow: rgba(51, 65, 85, 0.15);
            --teal: #0d9488;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-blur: 16px;
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.06), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            --glass-inset: inset 0 1px 0 0 rgba(255, 255, 255, 1);
            --glass-text: #1f2937;
            --glass-text-muted: rgba(31, 41, 55, 0.8);
            --glass-highlight: rgba(255, 255, 255, 1);
            --active-bg: rgba(51, 65, 85, 0.15);
            --active-border: rgba(51, 65, 85, 0.4);
            --active-text: #1f2937;
        }

        * {
            font-family: 'Space Grotesk', sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-primary);
            color: var(--fg-primary);
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            transition: color 0.5s ease;
            background-image: radial-gradient(circle at 50% 50%, var(--bg-secondary) 0%, var(--bg-primary) 100%);
        }

        .clock-font { font-family: 'Outfit', sans-serif; }
        .quote-font { font-family: 'Cinzel', serif; }

        /* Floating Background Elements */
        .floating-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.15;
            z-index: 0;
            will-change: transform;
        }

        [data-theme="day"] #shape1 { opacity: 0.25; }
        [data-theme="day"] #shape2 { opacity: 0.20; }
        [data-theme="day"] #shape3 { opacity: 0.20; }
        [data-theme="night"] .floating-shape { opacity: 0.15; filter: blur(120px); }

        /* --- GLASS COMPONENTS --- */

        .glass-element {
            background: var(--glass-bg);
            /* Fallback for browsers that don't support backdrop-filter */
            @supports not (backdrop-filter: blur(1px)) {
                background: var(--bg-secondary);
            }
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), var(--glass-inset);
            color: var(--glass-text);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-element:hover {
            transform: translateY(-1px);
            border-color: var(--glass-highlight);
        }

        .glass-element:active {
            transform: none;
            box-shadow: var(--glass-shadow);
        }

        .glass-element:active::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            pointer-events: none;
        }

        [data-theme="night"] .glass-element:active::after {
            background: rgba(255, 255, 255, 0.15);
        }

        /* --- MAIN LAYOUT --- */

        #topContent {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .center-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            min-height: 100vh;
            padding: 4rem 2rem;
        }

        /* Search Input */
        .search-input {
            position: relative;
            z-index: 120;
            width: 100%;
            padding: 1.25rem 1.5rem;
            padding-right: 6.5rem;
            font-size: 1.125rem;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            color: var(--glass-text);
            transition: all 0.3s ease;
            outline: none;
            box-shadow: var(--glass-shadow), var(--glass-inset);
        }

        .search-input:focus {
            border-color: transparent;
            box-shadow:
                var(--glass-shadow),
                0 0 25px var(--accent-glow),
                0 0 50px rgba(245, 166, 35, 0.05);
        }

        .search-input::placeholder { color: var(--glass-text-muted); }

        .search-icons {
            position: absolute;
            right: 1.25rem;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 130;
        }

        /* Engine Buttons */
        .engine-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 0.85rem;
            font-size: 0.9rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), var(--glass-inset);
            color: var(--glass-text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .engine-btn:hover { color: var(--glass-text); }

        .engine-btn.active {
            background: var(--active-bg);
            border: 1px solid var(--active-border);
            color: var(--active-text);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .engine-btn:active::after {
            content: ''; position: absolute; inset: 0;
            background: rgba(0,0,0,0.15);
        }
        [data-theme="night"] .engine-btn:active::after { background: rgba(255,255,255,0.15); }

        /* Quick Links Container (Fixed Bottom) */
        #linksWrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            padding-bottom: 1.5rem;
            background: linear-gradient(to top, var(--bg-primary) 10%, transparent);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .quick-link {
            display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
            padding: 0.6rem; border-radius: 0.75rem;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow), var(--glass-inset);
            cursor: pointer; text-decoration: none; color: var(--glass-text);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .quick-link:hover { transform: translateY(-3px); border-color: var(--glass-highlight); }
        .quick-link:hover .link-icon { transform: scale(1.1); color: var(--accent); }

        /* Footer Message (Single Line) */
        #footerMessage {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 60;
            font-size: 0.90rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            opacity: 1;
            transition: opacity 2s ease;
            text-decoration: none;
            color: var(--glass-text-muted);
            /* Flexbox for dot alignment */
            display: flex;
            align-items: center;
            gap: 0.5rem;
            /* Force single line */
            white-space: nowrap;
        }
        #footerMessage.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Blinking Dot with Neon Glow */
        .blink-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
        }

        @keyframes blink {
            0% {
                opacity: 0.4;
                /* Dim glow */
                box-shadow:
                    0 0 2px #22c55e,
                    0 0 2px #22c55e;
            }
            100% {
                opacity: 1;
                /* Bright glow */
                box-shadow:
                    0 0 2px #22c55e,
                    0 0 5px #22c55e,
                    0 0 15px #22c55e,
                    0 0 25px rgba(34, 197, 94, 0.6);
            }
        }

        /* Theme Toggle */
        .theme-toggle {
            display: flex; gap: 0.25rem; padding: 0.25rem;
            background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
            border: var(--glass-border); border-radius: 0.75rem; box-shadow: var(--glass-shadow);
            transition: opacity 1s ease, transform 1s ease;
        }

        .theme-btn {
            padding: 0.5rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600;
            background: transparent; border: none; color: var(--glass-text-muted);
            cursor: pointer; transition: all 0.2s ease; position: relative; overflow: hidden;
        }

        [data-theme="day"] .theme-btn { color: #1f2937; }
        [data-theme="night"] .theme-btn { color: rgba(255,255,255,0.7); }

        .theme-btn.active { background: var(--active-bg); color: var(--active-text); box-shadow: none; }

        /* Icon Buttons */
        .icon-btn {
            padding: 0.5rem; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05); color: var(--glass-text-muted);
            cursor: pointer; transition: all 0.2s ease; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        [data-theme="day"] .icon-btn { background: rgba(0, 0, 0, 0.05); border: 1px solid rgba(0, 0, 0, 0.05); color: #4b5563; }
        .icon-btn:hover { color: var(--accent); background: rgba(255, 255, 255, 0.2); }
        [data-theme="day"] .icon-btn:hover { background: rgba(0, 0, 0, 0.1); }
        .voice-btn.listening { color: var(--teal); border-color: var(--teal); box-shadow: 0 0 15px rgba(13, 148, 136, 0.3); }

        /* Sync Button */
        .sync-btn-container { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 100; transition: opacity 0.3s ease, transform 0.3s ease; }
        .sync-btn {
            font-size: 0.75rem; padding: 0.5rem 1rem; border-radius: 0.5rem;
            background: var(--glass-bg); backdrop-filter: blur(12px);
            border: var(--glass-border); box-shadow: var(--glass-shadow); color: var(--glass-text);
            text-decoration: none; transition: all 0.2s ease; white-space: nowrap;
        }
        .sync-btn:hover { background: var(--accent); color: #fff; border-color: transparent; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .fade-in { animation: fadeIn 0.6s ease forwards; opacity: 0; }
        .fade-out { animation: fadeOut 0.6s ease forwards; }

        .quote-text-dynamic { transition: font-size 0.5s ease; }
        .quote-small { font-size: 1.5rem; line-height: 1.4; font-weight: 100; }
        .quote-medium { font-size: 2rem; line-height: 1.4; font-weight: 100; }
        .quote-large { font-size: 2.5rem; line-height: 1.3; font-weight: 100; }


        /* Responsive */
        @media (max-width: 1024px) {
            #linksWrapper { display: none !important; }
            #footerMessage { display: none !important; }
        }

        @media (max-width: 768px) {
            .quick-links-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 0.5rem !important; }
            .quick-link { padding: 0.5rem !important; }
            .quick-link svg { width: 20px; height: 20px; }
            .search-input { font-size: 1rem; padding: 1rem 1.25rem; }
            .theme-toggle-container { transform: scale(0.8); opacity: 0; pointer-events: none; }
            .elive-logo { width: 80px; height: 80px; }

            .center-wrapper { top: 30%; width: 90%; }

            #voiceLangSelect {
                padding: 0.4rem 2rem 0.4rem 0.75rem;
                font-size: 0.75rem;
                height: auto;
                max-width: 100%;
            }
            #voiceModal .glass-element { padding: 1.25rem; max-width: 280px; width: 85%; }
        }

        @media (max-height: 700px) {
            .center-wrapper { top: 30%; }
            #logoWrapper img { width: 48px; height: 48px; }
            #infoWrapper { margin-bottom: 1rem; }
            #linksWrapper { padding-top: 0.5rem; }
        }

        @media (max-width: 480px) { .quick-links-grid { grid-template-columns: repeat(3, 1fr) !important; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

        button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .elive-logo { width: 100px; height: 100px; border-radius: 1.25rem; transition: transform 0.3s ease; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15)); }
        .elive-logo:hover { transform: rotate(-5deg) scale(1.05); }

        .hotkey-indicator { font-size: 0.625rem; padding: 2px 6px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; color: var(--fg-secondary); font-family: 'Space Grotesk', monospace; border: 1px solid var(--glass-border); }
        .hotkey-container { transition: opacity 1s ease; margin-top: 1rem; }
        .hotkey-container.hide { opacity: 0; pointer-events: none; }

        /* Custom Select Styling */
        #voiceLangSelect {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            color: var(--glass-text);
            background-color: var(--glass-bg);
        }

        #voiceLangSelect option {
            background-color: var(--bg-secondary);
            color: var(--fg-primary);
            padding: 10px;
        }

        [data-theme="night"] #voiceLangSelect option {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        /* Voice Wave Animation */
        .voice-wave span {
            width: 4px;
            height: 20px;
            background: var(--teal);
            border-radius: 4px;
            animation: wave 1s ease-in-out infinite;
            box-shadow: 0 0 10px var(--teal);
        }
        .voice-wave span:nth-child(1) { animation-delay: 0.0s; }
        .voice-wave span:nth-child(2) { animation-delay: 0.1s; }
        .voice-wave span:nth-child(3) { animation-delay: 0.2s; }
        .voice-wave span:nth-child(4) { animation-delay: 0.3s; }
        .voice-wave span:nth-child(5) { animation-delay: 0.4s; }
        .voice-wave span:nth-child(6) { animation-delay: 0.5s; }
        .voice-wave span:nth-child(7) { animation-delay: 0.6s; }

        @keyframes wave {
            0%, 100% { height: 15px; opacity: 0.5; }
            50% { height: 45px; opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="floating-shape" id="shape1" style="width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px;"></div>
    <div class="floating-shape" id="shape2" style="width: 300px; height: 300px; background: var(--teal); bottom: -50px; right: -50px; animation-delay: -5s;"></div>
    <div class="floating-shape" id="shape3" style="width: 200px; height: 200px; background: var(--accent-light); top: 50%; left: 50%; animation-delay: -10s;"></div>

    <!-- Main Content Wrapper -->
    <div id="topContent">
        <div class="center-wrapper">
            <!-- Logo -->
            <div id="logoWrapper" class="mb-4 fade-in" style="animation-delay: 0.1s;">
                <img src="logo-elive.png" alt="Elive Linux" class="elive-logo" onerror="this.style.display='none'">
            </div>

            <!-- Info -->
            <div id="infoWrapper" class="mb-12 fade-in" style="animation-delay: 0.15s; text-align: center; width: 90%; max-width: 1200px; flex-grow: 0; flex-shrink: 0;">
                <div id="quoteDisplay">
                    <p id="quoteText" class="quote-text-dynamic quote-large mb-2 quote-font" style="color: var(--fg-primary);"></p>
                    <p id="quoteAuthor" class="text-sm font-light" style="color: var(--fg-muted);"></p>
                </div>
                <div id="clockDisplay" class="text-center hidden">
                    <p id="clockTime" class="text-7xl md:text-8xl font-bold clock-font tracking-tighter" style="color: var(--fg-primary); line-height: 1;"></p>
                    <p id="clockDate" class="text-lg font-light mt-2 tracking-wide" style="color: var(--fg-secondary);"></p>
                </div>
            </div>

            <!-- Search -->
            <div id="searchWrapper" class="w-full px-4 fade-in relative z-[100]" style="animation-delay: 0.2s; max-width: 680px;">
                <form id="searchForm" class="search-container relative z-[110] mb-4">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search the web..." autocomplete="off" aria-label="Search input">
                    <div class="search-icons">
                        <button type="button" id="voiceBtn" class="icon-btn voice-btn" aria-label="Voice search" title="Voice Search (Ctrl+I)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                <line x1="12" y1="19" x2="12" y2="22"></line>
                            </svg>
                        </button>
                        <button type="submit" class="icon-btn" aria-label="Search">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.3-4.3"></path>
                            </svg>
                        </button>
                    </div>
                </form>

                <!-- Hotkey hint -->
                <div class="text-center mb-6 flex items-center justify-center gap-2 flex-wrap hotkey-container flex-shrink-0" id="hotkeyHint">
                    <span class="hotkey-indicator">Ctrl + K search</span>
                    <span class="hotkey-indicator">Ctrl + I voice</span>
                </div>

                <div class="flex flex-wrap justify-center gap-2">
                    <button class="engine-btn" data-engine="google">Google</button>
                    <button class="engine-btn active" data-engine="duck">Duck</button>
                    <button class="engine-btn" data-engine="ecosia">Ecosia</button>
                    <button class="engine-btn" data-engine="youtube">YouTube</button>
                    <button class="engine-btn" data-engine="forum">Forum</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Links Wrapper (Fixed Bottom) -->
    <div id="linksWrapper">
        <div class="quick-links-grid grid grid-cols-5 md:grid-cols-8 gap-3 md:gap-4 w-full max-w-4xl fade-in" style="animation-delay: 0.3s;" id="quickLinks"></div>

        <div class="flex flex-wrap justify-center gap-4 text-sm mt-2">
            <a href="https://www.elivecd.org/forum/" class="quick-link px-4 py-2" style="padding: 0.5rem 1rem;">
                <span style="color: var(--glass-text);">Elive Forum</span>
            </a>
            <a href="https://www.elivecd.org/" class="quick-link px-4 py-2" style="padding: 0.5rem 1rem;">
                <span style="color: var(--glass-text);">Elive Website</span>
            </a>
        </div>
    </div>

    <!-- Footer Message (Single Line + Fast Blinking Neon Dot) -->
    <a href="https://www.elivecd.org/patreon" id="footerMessage" class="glass-element" aria-label="Support Elive">
        <span class="blink-dot"></span>
        Help us keeping this amazing project alive
    </a>

    <!-- Voice Modal -->
    <div id="voiceModal" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/20 backdrop-blur-md transition-all duration-500">
        <div class="glass-element p-8 rounded-3xl text-center max-w-xs w-full mx-4 border-teal/30">
            <div class="voice-wave flex justify-center gap-1.5 h-16 mb-6 items-center">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <p class="text-lg font-semibold mb-2" style="color: var(--glass-text);">Listening...</p>
            <p id="voiceStatus" class="text-sm mb-6" style="color: var(--glass-text-muted);">Speak your search query</p>

            <select id="voiceLangSelect" class="w-full p-3 mb-6 rounded-xl border border-white/10 text-sm outline-none focus:border-teal/50 focus:bg-white/10 transition-all cursor-pointer" style="background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%20fill%3D%22none%22%20stroke%3D%22%230d9488%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em;">
                <option value="af-ZA">Afrikaans (South Africa)</option>
                <option value="am-ET">Amharic (Ethiopia)</option>
                <option value="ar-SA">Arabic (Saudi Arabia)</option>
                <option value="hy-AM">Armenian (Armenia)</option>
                <option value="az-AZ">Azerbaijani (Azerbaijan)</option>
                <option value="eu-ES">Basque (Spain)</option>
                <option value="bn-IN">Bengali (India)</option>
                <option value="bg-BG">Bulgarian (Bulgaria)</option>
                <option value="ca-ES">Catalan (Spain)</option>
                <option value="zh-CN">Chinese (Simplified, China)</option>
                <option value="zh-TW">Chinese (Traditional, Taiwan)</option>
                <option value="hr-HR">Croatian (Croatia)</option>
                <option value="cs-CZ">Czech (Czech Republic)</option>
                <option value="da-DK">Danish (Denmark)</option>
                <option value="nl-NL">Dutch (Netherlands)</option>
                <option value="en-US">English (US)</option>
                <option value="en-GB">English (UK)</option>
                <option value="et-EE">Estonian (Estonia)</option>
                <option value="fil-PH">Filipino (Philippines)</option>
                <option value="fi-FI">Finnish (Finland)</option>
                <option value="fr-FR">French (France)</option>
                <option value="gl-ES">Galician (Spain)</option>
                <option value="ka-GE">Georgian (Georgia)</option>
                <option value="de-DE">German (Germany)</option>
                <option value="el-GR">Greek (Greece)</option>
                <option value="gu-IN">Gujarati (India)</option>
                <option value="iw-IL">Hebrew (Israel)</option>
                <option value="hi-IN">Hindi (India)</option>
                <option value="hu-HU">Hungarian (Hungary)</option>
                <option value="is-IS">Icelandic (Iceland)</option>
                <option value="id-ID">Indonesian (Indonesia)</option>
                <option value="it-IT">Italian (Italy)</option>
                <option value="ja-JP">Japanese (Japan)</option>

    <script>
        // ====== CONFIGURATION ======
        const demo_mode = false; // Set to false for normal behavior

        // ====== DATA ======
        const quotes = [
            { text: "You can only be as good as you dare to be bad.", author: "John Barrymore" },
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
            { text: "Simplicity is the ultimate sophistication.", author: "Leonardo da Vinci" },
            { text: "The greatest glory in living lies not in never falling, but in rising every time we fall.", author: "Nelson Mandela" },
            { text: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" },

            { text: "Insecure people put others down to raise themselves up", author: "Habeebe Akande" },
            { text: "Practice radical humility, and give credit everywhere except to your ego.", author: "Wayne W. Dyer" },
            { text: "Any step in the direction of expressing your creative impulses is a step in the direction of actualizing the genius that resides within you.", author: "Dr. Wayne Dyer" },
            { text: "Remembering you are going to die is the best way I know to avoid the trap of thinking you have something to lose. You are already naked. There is no reason not to follow your heart.", author: "Steve Jobs" },
            { text: "Nobody panics when things go 'according to plan'. Even if the plan is horrifying!", author: "The Joker (Heath Ledger)" },
            { text: "Do I really look like a guy with a plan? You know what I am? I'm a dog chasing cars. I wouldn't know what to do with one if I caught it! You know, I just... *do* things.", author: "The Joker (Heath Ledger)" },
            { text: "It's not about money... it's about sending a message.", author: "The Joker (Heath Ledger)" },
            { text: "Give a man a mask and he will show his true face.", author: "Oscar Wilde" },
            { text: "To expect the unexpected shows a thoroughly modern intellect.", author: "Oscar Wilde" },
            { text: "Beauty is the only thing that time cannot harm. Philosophies fall away like sand, creeds follow one another, but what is beautiful is a joy for all seasons, a possession for all eternity.", author: "Oscar Wilde" },
            { text: "Ordinary riches can be stolen; real riches cannot. In your soul are infinitely precious things that cannot be taken from you.", author: "Oscar Wilde" },
            { text: "Be yourself; everyone else is already taken.", author: "Oscar Wilde" },
            { text: "Always forgive your enemies; nothing annoys them so much.", author: "Oscar Wilde" },
            { text: "To live is the rarest thing in the world. Most people exist, that is all.", author: "Oscar Wilde" },
            { text: "With freedom, books, flowers, and the moon, who could not be happy?", author: "Oscar Wilde" },
            { text: "If you want to tell people the truth, make them laugh, otherwise they’ll kill you.", author: "Oscar Wilde" },
            { text: "There is only one thing in the world worse than being talked about, and that is not being talked about.", author: "Oscar Wilde" },
            { text: "To define is to limit.", author: "Oscar Wilde" },
            { text: "Morality is simply the attitude we adopt towards people we personally dislike.", author: "Oscar Wilde" },
            { text: "I don’t want to go to heaven. None of my friends are there.", author: "Oscar Wilde" },
            { text: "Most people are other people. Their thoughts are someone else’s opinions, their lives a mimicry, their passions a quotation.", author: "Oscar Wilde" },
            { text: "Anyone who lives within their means suffers from a lack of imagination.", author: "Oscar Wilde" },
            { text: "I am not young enough to know everything.", author: "Oscar Wilde" },
            { text: "Every saint has a past, and every sinner has a future.", author: "Oscar Wilde" },
            { text: "Man is least himself when he talks in his own person. Give him a mask, and he will tell you the truth.", author: "Oscar Wilde" },
            { text: "Those who find ugly meanings in beautiful things are corrupt without being charming. This is a fault. Those who find beautiful meanings in beautiful things are the cultivated. For these there is hope.", author: "Oscar Wilde" },
            { text: "The very essence of romance is uncertainty.", author: "Oscar Wilde" },
            { text: "There are only two kinds of people who are really fascinating: people who know absolutely everything, and people who know absolutely nothing.", author: "Oscar Wilde" },
            { text: "We live in an age when unnecessary things are our only necessities.", author: "Oscar Wilde" },
            { text: "Society often forgives the criminal; it never forgives the dreamer.", author: "Oscar Wilde" },
            { text: "Live! Live the wonderful life that is in you! Let nothing be lost upon you. Be always searching for new sensations. Be afraid of nothing.", author: "Oscar Wilde" },
            { text: "Fashion is a form of ugliness so intolerable that we have to alter it every six months.", author: "Oscar Wilde" },
            { text: "Genius is born—not paid.", author: "Oscar Wilde" },
            { text: "The old believe everything, the middle-aged suspect everything, the young know everything.", author: "Oscar Wilde" },
            { text: "I like men who have a future and women who have a past.", author: "Oscar Wilde" },
            { text: "Illusion is the first of all pleasures.", author: "Oscar Wilde" },
            { text: "Always deliver more than expected.", author: "Larry Page" },
            { text: "If we were motivated by money, we would have sold the company a long time ago and ended up on a beach.", author: "Larry Page" },
            { text: "It’s very hard to fail completely if you aim high enough.", author: "Larry Page" },
            { text: "Optimism is important. You have to be a little silly about the goals you are going to set. You should try to do things that most people would not do.", author: "Larry Page" },
            { text: "It is easier to make progress on mega-ambitious dreams. Since no one else is crazy enough to do it, you have little competition.", author: "Larry Page" },
            { text: "If you’re not doing some things that are crazy, then you’re doing the wrong things.", author: "Larry Page" },
            { text: "Coming up with an idea is the least important part of creating something great. It has to be the right idea and have good taste, but the execution and delivery are what’s key.", author: "Sergey Brin" },
            { text: "Especially in technology, we need revolutionary change, not incremental change.", author: "Larry Page" },
            { text: "Failure is an option here. If things are not failing, you are not innovating enough.", author: "Elon Musk" },
            { text: "If something is important enough, even if the odds are against you, you should still do it.", author: "Elon Musk" },
            { text: "The first step is to establish that something is possible; then probability will occur.", author: "Elon Musk" },
            { text: "Really, the only thing that makes sense is to strive for greater collective enlightenment.", author: "Elon Musk" },
            { text: "Great companies are build on great products", author: "Elon Musk" },
            { text: "Any product that needs a manual to work is broken", author: "Elon Musk" },
            { text: "My motivation for all my companies has been to be involved in something that I thought would have a significant impact on the world.", author: "Elon Musk" },
            { text: "Persistence is very important. You should not give up unless you are forced to give up.", author: "Elon Musk" },
            { text: "The idea of lying on a beach as my main thing just sounds like the worst. It sounds horrible to me. I would go bonkers. I would have to be on serious drugs. I’d be super-duper bored. I like high intensity.", author: "Elon Musk" },
            { text: "Imagination is more important than knowledge.", author: "Albert Einstein" },

            // Abraham Lincoln
            { text: "Folks are usually about as happy as they make their minds up to be.", author: "Abraham Lincoln" },

            // MJ DeMarco
            { text: "We are not taught to be thinkers, but reflectors of our culture. Let’s teach our children to be thinkers.", author: "MJ DeMarco" },
            // Alan Alda
            { text: "The creative is the place where no one else has ever been. You have to leave the city of your comfort and go into the wilderness of your intuition. What you’ll discover will be wonderful. What you’ll discover is yourself.", author: "Alan Alda" },

            // Alan Lightman
            { text: "Suppose time is a circle, bending back on itself. The world repeats itself, precisely, endlessly.", author: "Alan Lightman" },

            // Alan W. Watts
            { text: "A man does not really begin to be alive until he has lost himself, until he has released the anxious grasp which he normally holds upon his life, his property, his reputation and position.", author: "Alan W. Watts" },
            { text: "A world which increasingly consists of destinations without journeys between them, a world which values only 'getting somewhere' as fast as possible, becomes a world without substance.", author: "Alan W. Watts" },
            { text: "As long as you do not know how to die and come to life again, you are but a sorry traveler on this dark earth.", author: "Alan W. Watts" },
            { text: "Belief clings, but faith lets go.", author: "Alan W. Watts" },
            { text: "Chuang-tzu: 'The perfect man employs his mind as a mirror; it grasps nothing; it refuses nothing; it receives, but does not keep.'", author: "Alan W. Watts" },
            { text: "Eternal life is realized when the last trace of difference between \"I\" and \"now\" has vanished - when there is just this \"now\" and nothing else.", author: "Alan W. Watts" },
            { text: "Everything is change. Nothing can be held on to. And if you go with the flux, you flow with it. However, if you resist the stream, it fights you. If you realize this, you swim with the flow—you go with it, and you’re at peace. This is particularly true when it comes to those moments when life really seems to be taking us away, and the stream of change is going to swallow us completely. And so at the moment of death, we withdraw and say, “No, no, no! Not that! Not yet!” But the whole problem is that we don’t realize that the only thing to do when that moment comes is to go over the waterfall—just as you go on from one day to the next, just as you go to sleep at night. When the moment comes, we should be absolutely willing to die.", author: "Alan W. Watts" },
            { text: "Faith is a state of openness or trust. To have faith is like when you trust yourself to the water. You don’t grab hold of the water when you swim, because if you do you will become stiff and tight in the water, and sink. You have to relax, and the attitude of faith is the very opposite of clinging, and holding on. In other words, a person who is fanatic in matters of religion, and clings to certain ideas about the nature of God and the universe becomes a person who has no faith at all. Instead they are holding tight. But the attitude of faith is to let go, and become open to truth, whatever it might turn out to be.", author: "Alan W. Watts" },
            { text: "For if we open our eyes and see clearly, it becomes obvious that there is no other time than this instant, and that the past and the future are abstractions without any concrete reality.", author: "Alan W. Watts" },
            { text: "For there is never anything but the present, and if one cannot live there, one cannot live anywhere.", author: "Alan W. Watts" },
            { text: "Genuine love comes from knowledge, not from a sense of duty or guilt.", author: "Alan W. Watts" },
            { text: "Great power is worry, and total power is boredom, such that even God renounces it and pretends, instead, that he is people and fish and insects and plants: the myth of the king who goes wandering among his subjects in disguise.", author: "Alan W. Watts" },
            { text: "Hurrying and delaying are alike ways of trying to resist the present.", author: "Alan W. Watts" },
            { text: "I am basically an eternal existence momentarily and perhaps needlessly terrified by one half of itself.", author: "Alan W. Watts" },
            { text: "I have always been fascinated by the law of reversed effort. Sometimes I call it the “backwards law.” When you try to stay on the surface of the water, you sink; but when you try to sink, you float. When you hold your breath, you lose it—which immediately calls to mind an ancient and much neglected saying, “Whosoever would save his soul shall lose it.", author: "Alan W. Watts" },
            { text: "I have no other self than the totality of things of which I am aware.", author: "Alan W. Watts" },
            { text: "If we are open only to discoveries which will accord with what we know already, we may as well stay shut.", author: "Alan W. Watts" },
            { text: "If we get rid of all wishful thinking and dubious metaphysical speculations, we can hardly doubt that – at a time not too distant – each one of us will simply cease to be. It won’t be like going into darkness forever, for there will be neither darkness, nor time, nor sense of futility, nor anyone to feel anything about it. Try as best you can to imagine this, and keep at it. The universe will, supposedly, be going on as usual, but for each individual it will be as if it had never happened at all; and even that is saying too much, because there won’t be anyone for whom it never happened. Make this prospect as real as possible: the one total certainty. You will be as if you had never existed, which was, however, the way you were before you did exist – and not only you but everything else. Nevertheless, with such an improbable past, here we are. We begin from nothing and end in nothing. You can say that again. Think it over and over, trying to conceive the fact of coming to never having existed. After a while you will begin to feel rather weird, as if this very apparent something that you are is at the same time nothing at all. Indeed, you seem to be rather firmly and certainly grounded in nothingness, much as your sight seems to emerge from that total blankness behind your eyes. The weird feeling goes with the fact that you are being introduced to a new common sense, a new logic, in which you are beginning to realize the identity of ku and shiki, void and form. All of a sudden it will strike you that this nothingness is the most potent, magical, basic, and reliable thing you ever thought of, and that the reason you can’t form the slight idea of it is that it’s yourself. But not the self you thought you were.", author: "Alan W. Watts" },
            { text: "If you awaken from this illusion and you understand that black implies white, self implies other, life implies death (or shall I say death implies life?), you can feel yourself – not as a stranger in the world, not as something here on probation, not as something that has arrived here by fluke - but you can begin to feel your own existence as absolutely fundamental.", author: "Alan W. Watts" },
            { text: "Instant coffee, for example, is a well–deserved punishment for being in a hurry to reach the future.", author: "Alan W. Watts" },
            { text: "Kindly let me help you or you will drown said the monkey putting the fish safely up a tree.", author: "Alan W. Watts" },
            { text: "Life exists only at this very moment, and in this moment it is infinite and eternal. For the present moment is infinitely small; before we can measure it, it has gone, and yet it persists for ever.", author: "Alan W. Watts" },
            { text: "Much of the secret of life consists in knowing how to laugh, and also how to breathe.", author: "Alan W. Watts" },
            { text: "Only doubtful truths need defense.", author: "Alan W. Watts" },
            { text: "Paradox as it may seem, we likewise find life meaningful only when we have seen that it is without purpose, and know the “mystery of the universe” only when we are convinced that we know nothing about it at all.", author: "Alan W. Watts" },
            { text: "Self-consciousness is a stoppage because it is like interrupting a song after every note so as to listen to the echo, and then feeling irritated because of the loss of rhythm.", author: "Alan W. Watts" },
            { text: "Stay in the center, and you will be ready to move in any direction.", author: "Alan W. Watts" },
            { text: "The ego-self constantly pushes reality away. It constructs a future out of empty expectations and a past out of regretful memories.", author: "Alan W. Watts" },
            { text: "The frightened mind that runs away from everyday terrors meets the seeking mind that wants a better world.", author: "Alan W. Watts" },
            { text: "The paradox about waking up—I mean the ordinary kind of waking up that occurred to you and me this morning—is that you can’t make it happen, yet it’s inevitable. The same holds true spiritually. You can’t wish, pray, beg, force, or meditate yourself awake.", author: "Alan W. Watts" },
            { text: "To the Taoist mentality, the aimless, empty life does not suggest anything depressing. On the contrary, it suggests the freedom of clouds and mountain streams, wandering nowhere, of flowers in impenetrable canyons, beautiful for no one to see, and of the ocean surf forever washing the sand, to no end.", author: "Alan W. Watts" },
            { text: "To travel is to be alive, but to get somewhere is to be dead, for as our own proverb says, “To travel well is better than to arrive.", author: "Alan W. Watts" },
            { text: "We know that from time to time, there arise among human beings, people who seem to exude love as naturally as the sun gives out heat.", author: "Alan W. Watts" },
            { text: "When it comes down to it, government is simply an abandonment of responsibility on the assumption that there are people, other than ourselves, who really know how to manage things. But the government, run ostensibly for the good of the people, becomes a self-serving corporation. To keep things under control, it proliferates law of ever-increasing complexity and unintelligibility, and hinders productive work by demanding so much accounting on paper that the record of what has been done becomes more important than what has actually been done. [...] The Taoist moral is that people who mistrust themselves and one another are doomed.", author: "Alan W. Watts" },
            { text: "Whether we like it or not, change comes, and the greater the resistance, the greater the pain. Buddhism perceives the beauty of change, for life is like music in this: if any note or phrase is held for longer than its appointed time, the melody is lost. Thus Buddhism may be summed up in two phrases: “Let go!” and “Walk on!” Drop the craving for self, for permanence, for particular circumstances, and go straight ahead with the movement of life.", author: "Alan W. Watts" },
            { text: "Words can be communicative only between those who share similar experiences.", author: "Alan W. Watts" },
            { text: "You did not come into this world. You came out of it, like a wave from the ocean. You are not a stranger here.", author: "Alan W. Watts" },
            { text: "You do not play a sonata in order to reach the final chord, and if the meanings of things were simply in ends, composers would write nothing but finales.", author: "Alan W. Watts" },
            { text: "Life requires no future to complete itself nor explanation to justify itself. In this moment it is finished.", author: "Alan W. Watts" },

            // Albert Einstein
            { text: "A clever person solves a problem. A wise person avoids it.", author: "Albert Einstein" },
            { text: "There are only two ways to live your life. One is as though nothing is a miracle. The other is as though everything is a miracle.", author: "Albert Einstein" },
            { text: "A human being is a part of the whole called by us universe, a part limited in time and space. He experiences himself, his thoughts and feeling as something separated from the rest, a kind of optical delusion of his consciousness.", author: "Albert Einstein" },
            { text: "A question that sometimes drives me hazy: am I or are the others crazy?", author: "Albert Einstein" },
            { text: "Any fool can know. The point is to understand.", author: "Albert Einstein" },
            { text: "Anyone who has never made a mistake has never tried anything new.", author: "Albert Einstein" },
            { text: "Black holes are where God divided by zero.", author: "Albert Einstein" },
            { text: "Blind belief in authority is the greatest enemy of truth.", author: "Albert Einstein" },
            { text: "Creativity is intelligence having fun.", author: "Albert Einstein" },
            { text: "Everything must be made as simple as possible. But not simpler.", author: "Albert Einstein" },
            { text: "Few are those who see with their own eyes and feel with their own hearts.", author: "Albert Einstein" },
            { text: "Genius is 1% talent and 99% percent hard work...", author: "Albert Einstein" },
            { text: "God does not play dice with the universe.", author: "Albert Einstein" },
            { text: "Gravitation is not responsible for people falling in love.", author: "Albert Einstein" },
            { text: "Great spirits have always encountered violent opposition from mediocre minds.", author: "Albert Einstein" },
            { text: "However rare true love may be, it is less so than true friendship.", author: "Albert Einstein" },
            { text: "I have no special talents. I am only passionately curious.", author: "Albert Einstein" },
            { text: "I know not with what weapons World War III will be fought, but World War IV will be fought with sticks and stones.", author: "Albert Einstein" },
            { text: "I live in that solitude which is painful in youth, but delicious in the years of maturity.", author: "Albert Einstein" },
            { text: "I must be willing to give up what I am in order to become what I will be.", author: "Albert Einstein" },
            { text: "I never made one of my discoveries through the process of rational thinking", author: "Albert Einstein" },
            { text: "I speak to everyone in the same way, whether he is the garbage man or the president of the university.", author: "Albert Einstein" },
            { text: "I'd rather be an optimist and a fool than a pessimist and right.", author: "Albert Einstein" },
            { text: "If A is a success in life, then A equals x plus y plus z. Work is x; y is play; and z is keeping your mouth shut", author: "Albert Einstein" },
            { text: "If I were not a physicist, I would probably be a musician. I often think in music. I live my daydreams in music.", author: "Albert Einstein" },
            { text: "If a cluttered desk is a sign of a cluttered mind, of what, then, is an empty desk a sign?", author: "Albert Einstein" },
            { text: "If at first the idea is not absurd, then there will be no hope for it.", author: "Albert Einstein" },
            { text: "If we knew what it was we were doing, it would not be called research, would it?", author: "Albert Einstein" },
            { text: "If you always do what you always did, you will always get what you always got.", author: "Albert Einstein" },
            { text: "If you can't explain it to a six year old, you don't understand it yourself.", author: "Albert Einstein" },
            { text: "If you want to live a happy life, tie it to a goal, not to people or things.", author: "Albert Einstein" },
            { text: "If you want your children to be intelligent, read them fairy tales. If you want them to be more intelligent, read them more fairy tales.", author: "Albert Einstein" },
            { text: "Imagination is everything. It is the preview of life's coming attractions.", author: "Albert Einstein" },
            { text: "Imagination is more important than knowledge. For knowledge is limited, while imagination embraces the entire world.", author: "Albert Einstein" },
            { text: "Imagination is the highest form of research.", author: "Albert Einstein" },
            { text: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" },
            { text: "Insanity is doing the same thing over and over again but expecting different results.", author: "Albert Einstein" },
            { text: "It is not that I'm so smart. But I stay with the questions much longer.", author: "Albert Einstein" },
            { text: "It would be possible to describe everything scientifically, but it would make no sense; it would be without meaning.", author: "Albert Einstein" },
            { text: "Life is like riding a bicycle. To keep your balance, you must keep moving.", author: "Albert Einstein" },
            { text: "Logic will get you from A to Z; imagination will get you everywhere.", author: "Albert Einstein" },
            { text: "Love is a better master than duty.", author: "Albert Einstein" },
            { text: "Never memorize something that you can look up.", author: "Albert Einstein" },
            { text: "Nothing happens until something moves.", author: "Albert Einstein" },
            { text: "Once we accept our limits, we go beyond them.", author: "Albert Einstein" },
            { text: "Once you can accept the universe as matter expanding into nothing that is something, wearing stripes with plaid comes easy.", author: "Albert Einstein" },
            { text: "Only a life lived for others is a life worthwhile.", author: "Albert Einstein" },
            { text: "Our task must be to free ourselves by widening our circle of compassion to embrace all living creatures.", author: "Albert Einstein" },
            { text: "Out of clutter, find simplicity.", author: "Albert Einstein" },
            { text: "Peace cannot be kept by force; it can only be achieved by understanding.", author: "Albert Einstein" },
            { text: "Reality is merely an illusion, albeit a very persistent one.", author: "Albert Einstein" },
            { text: "Science without religion is lame, religion without science is blind.", author: "Albert Einstein" },
            { text: "The best way to cheer yourself is to cheer somebody else up.", author: "Albert Einstein" },
            { text: "The gift of fantasy has meant more to me than my talent for absorbing positive knowledge.", author: "Albert Einstein" },
            { text: "The important thing is not to stop questioning. Curiosity has its own reason for existence.", author: "Albert Einstein" },
            { text: "The measure of intelligence is the ability to change.", author: "Albert Einstein" },
            { text: "The most beautiful experience we can have is the mysterious. It is the fundamental emotion that stands at the cradle of true art.", author: "Albert Einstein" },
            { text: "The pursuit of truth and beauty is a sphere of activity in which we are permitted to remain children all our lives.", author: "Albert Einstein" },
            { text: "The secret to creativity is knowing how to hide your sources.", author: "Albert Einstein" },
            { text: "The world as we have created it is a process of our thinking. It cannot be changed without changing our thinking.", author: "Albert Einstein" },
            { text: "The world is a dangerous place to live, not because of the people who are evil, but because of the people who don't do anything about it.", author: "Albert Einstein" },
            { text: "Time is an illusion.", author: "Albert Einstein" },
            { text: "To raise new questions, new possibilities, to regard old problems from a new angle, requires creative imagination and marks real advance in science.", author: "Albert Einstein" },
            { text: "Try not to become a man of success. Rather become a man of value.", author: "Albert Einstein" },
            { text: "Two things are infinite: the universe and human stupidity; and I'm not sure about the universe.", author: "Albert Einstein" },
            { text: "We all know that light travels faster than sound. That's why certain people appear bright until you hear them speak.", author: "Albert Einstein" },
            { text: "We cannot solve a problem by using the same kind of thinking we used when we created them.", author: "Albert Einstein" },
            { text: "We dance for laughter, we dance for tears, we dance for madness, we dance for fears, we dance for hopes, we dance for dreams.", author: "Albert Einstein" },
            { text: "What is right is not always popular and what is popular is not always right.", author: "Albert Einstein" },
            { text: "When you are courting a nice girl an hour seems like a second. When you sit on a red-hot cinder a second seems like an hour. That's relativity.", author: "Albert Einstein" },
            { text: "When you trip over love, it is easy to get up. But when you fall in love, it is impossible to stand again.", author: "Albert Einstein" },
            { text: "Whoever is careless with the truth in small matters cannot be trusted with important matters", author: "Albert Einstein" },
            { text: "Wisdom is not a product of schooling but of the lifelong attempt to acquire it.", author: "Albert Einstein" },
            { text: "You never fail until you stop trying.", author: "Albert Einstein" },

            // C.E.M. Joad
            { text: "Creativity is knowing how to hide your sources", author: "C.E.M. Joad" },

            // Albert Camus
            { text: "All great deeds and all great thoughts have a ridiculous beginning.", author: "Albert Camus" },
            { text: "Don’t walk in front of me… I may not follow. Don’t walk behind me… I may not lead. Walk beside me… just be my friend", author: "Albert Camus" },

            // Albert von Szent-Györgyi
            { text: "A discovery is said to be an accident meeting a prepared mind.", author: "Albert von Szent-Györgyi" },
            { text: "Discovery consists of seeing what everybody has seen and thinking what nobody has thought.", author: "Albert von Szent-Györgyi" },

            // Alexandre Dumas fils
            { text: "The difference between genius and stupidity is: genius has its limits.", author: "Alexandre Dumas fils" },

            // Alfred Tennyson
            { text: "If I had a flower for every time I thought of you...I could walk through my garden forever.", author: "Alfred Tennyson" },

            // Alfred Noble
            { text: "If I have a thousand ideas and only one turns out to be good, I am satisfied.", author: "Alfred Noble" },

            // Alan Cohen
            { text: "Will you ever run out of creative ideas and expressions? Ha! The more creative ideas you have, the more you will discover.  Creativity is a tree with countless branches that never stop blossoming.", author: "Alan Cohen" },

            // Alan Kay
            { text: "The best way to predict the future is to invent it.", author: "Alan Kay" },

            // Alan Robinson and Dean Schroeder
            { text: "Ideas are the engines of progress. They improve people’s lives by creating better ways to do things. They build and grow successful organizations and keep them healthy and prosperous. Without the ability to get new ideas, an organization stagnates and declines and will eventually be eliminated by competitors who do have fresh ideas.", author: "Alan Robinson and Dean Schroeder" },

            // Alfred North Whitehead
            { text: "Almost all really new ideas have a certain aspect of foolishness when they are just produced.", author: "Alfred North Whitehead" },
            { text: "The silly question is the first intimation of some totally new development.", author: "Alfred North Whitehead" },
            { text: "The vitality of thought into adventure. Ideas won’t keep. Something must be done about them.", author: "Alfred North Whitehead" },

            // Allyson Schwartz
            { text: "Small businesses are vital contributors to our economy. They are the economic engine that is creating jobs, exploring innovation, and expanding opportunities for Americans in every community across the Nation.", author: "Allyson Schwartz" },

            // Anaïs Nin
            { text: "Love never dies a natural death. It dies because we don't know how to replenish its source. It dies of blindness and errors and betrayals. It dies of illness and wounds; it dies of weariness, of witherings, of tarnishings.", author: "Anaïs Nin" },
            { text: "We don't see things as they are, we see them as we are.", author: "Anaïs Nin" },

            // Anatole France
            { text: "It is by acts and not by ideas that people live.", author: "Anatole France" },
            { text: "To accomplish great things we must dream as well as act.", author: "Anatole France" },

            // Ananda K. Coomaraswamy
            { text: "We have come to think of art and work as incompatible, or at least independent categories and have for the first time in history created an industry without art.", author: "Ananda K. Coomaraswamy" },

            // Andy Warhol
            { text: "They always say time changes things, but you actually have to change them yourself.", author: "Andy Warhol" },

            // Andre Gide
            { text: "You cannot discover new oceans unless you have the courage to lose sight of the shore.", author: "Andre Gide" },
            { text: "It is better to be hated for what you are than to be loved for what you are not.", author: "Andre Gide" },

            // Andrew Mason
            { text: "One of the challenges of innovation is figuring out how to wipe your mind clean about what you should be doing at any given moment, and not having a religious attachment to what’s gotten you there thus far.", author: "Andrew Mason" },

            // Anonymous
            { text: "Necessity is the mother of invention.", author: "Anonymous" },

            // Bill Keane
            { text: "Yesterday is history, tomorrow is a mystery, today is a gift of God, which is why we call it the present.", author: "Bill Keane" },

            // Bill Watterson
            { text: "Reality continues to ruin my life.", author: "Bill Watterson" },

            // Bob Marley
            { text: "One good thing about music, when it hits you, you feel no pain.", author: "Bob Marley" },
            { text: "Only once in your life, I truly believe, you find someone who can completely turn your world around. You tell them things that you’ve never shared with another soul and they absorb everything you say and actually want to hear more. You share hopes for the future, dreams that will never come true, goals that were never achieved and the many disappointments life has thrown at you. When something wonderful happens, you can’t wait to tell them about it, knowing they will share in your excitement. They are not embarrassed to cry with you when you are hurting or laugh with you when you make a fool of yourself. Never do they hurt your feelings or make you feel like you are not good enough, but rather they build you up and show you the things about yourself that make you special and even beautiful. There is never any pressure, jealousy or competition but only a quiet calmness when they are around. You can be yourself and not worry about what they will think of you because they love you for who you are. The things that seem insignificant to most people such as a note, song or walk become invaluable treasures kept safe in your heart to cherish forever. Memories of your childhood come back and are so clear and vivid it’s like being young again. Colours seem brighter and more brilliant. Laughter seems part of daily life where before it was infrequent or didn’t exist at all. A phone call or two during the day helps to get you through a long day’s work and always brings a smile to your face. In their presence, there’s no need for continuous conversation, but you find you’re quite content in just having them nearby. Things that never interested you before become fascinating because you know they are important to this person who is so special to you. You think of this person on every occasion and in everything you do. Simple things bring them to mind like a pale blue sky, gentle wind or even a storm cloud on the horizon. You open your heart knowing that there’s a chance it may be broken one day and in opening your heart, you experience a love and joy that you never dreamed possible. You find that being vulnerable is the only way to allow your heart to feel true pleasure that’s so real it scares you. You find strength in knowing you have a true friend and possibly a soul mate who will remain loyal to the end. Life seems completely different, exciting and worthwhile. Your only hope and security is in knowing that they are a part of your life.", author: "Bob Marley" },
            { text: "The truth is, everyone is going to hurt you. You just got to find the ones worth suffering for.", author: "Bob Marley" },
            { text: "You may not be her first, her last, or her only. She loved before she may love again. But if she loves you now, what else matters? She's not perfect—you aren't either, and the two of you may never be perfect together but if she can make you laugh, cause you to think twice, and admit to being human and making mistakes, hold onto her and give her the most you can. She may not be thinking about you every second of the day, but she will give you a part of her that she knows you can break—her heart. So don't hurt her, don't change her, don't analyze and don't expect more than she can give. Smile when she makes you happy, let her know when she makes you mad, and miss her when she's not there.", author: "Bob Marley" },

            // Anthony Jay
            { text: "The uncreative mind can spot wrong answers, but it takes a very creative mind to spot wrong questions.", author: "Anthony Jay" },

            // Antoine Saint-Exupery
            { text: "A pile of rocks ceases to be a rock pile when somebody contemplates it with the idea of a cathedral in mind.", author: "Antoine Saint-Exupery" },

            // Bernard M. Baruch
            { text: "Be who you are and say what you feel, because those who mind don't matter, and those who matter don't mind.", author: "Bernard M. Baruch" },

            // Aristotle
            { text: "It is during our darkest moments that we must focus to see the light.", author: "Aristotle" },

            // Carl Ally
            { text: "The creative person wants to be a know-it-all. He wants to know about all kinds of things: ancient history, nineteenth-century mathematics, current manufacturing techniques, flower arranging, and hog futures. Because he never knows when these ideas might come together to form a new idea. It may happen six minutes later or six months, or six years down the road. But he has faith that it will happen.", author: "Carl Ally" },

            // Cassandra Clare
            { text: "Have you fallen in love with the wrong person yet?' Jace said, 'Unfortunately, Lady of the Haven, my one true love remains myself.' ...'At least,' she said, 'you don't have to worry about rejection, Jace Wayland.' 'Not necessarily. I turn myself down occasionally, just to keep it interesting.'", author: "Cassandra Clare" },

            // Charles Bukowski
            { text: "Some people never go crazy. What truly horrible lives they must lead.", author: "Charles Bukowski" },

            // Carl Jung
            { text: "The creation of something new is not accomplished by the intellect, but by the play instinct arising from inner necessity. The creative mind plays with the object it loves.", author: "Carl Jung" },

            // Cassandra Clare
            { text: "One must always be careful of books,\" said Tessa, \"and what is inside them, for words have the power to change us.", author: "Cassandra Clare" },
            { text: "The greater the contrast, the greater the potential. Great energy only comes from a correspondingly great tension of opposites.", author: "Carl Jung" },

            // Arthur C. Clarke
            { text: "New ideas pass through three periods: It can’t be done, It probably can be done, but it’s not worth doing, and I knew it was a good idea all along.", author: "Arthur C. Clarke" },

            // Arthur Koestler
            { text: "The more original a discovery, the more obvious it seems afterwards.", author: "Arthur Koestler" },

            // Arthur C. Clarke
            { text: "The only way to discover the limits of the possible is to go beyond them into the impossible.", author: "Arthur C. Clarke" },

            // Barnes Wallis
            { text: "There is a natural opposition among men to anything they have not thought of themselves.", author: "Barnes Wallis" },

            // Benjamin Dana
            { text: "There has been opposition to every innovation in the history of man, with the possible exception of the sword.", author: "Benjamin Dana" },

            // Benjamin Franklin Wade
            { text: "Go to heaven for the climate and hell for the company.", author: "Benjamin Franklin Wade" },

            // Bessie Anderson Stanley
            { text: "He has achieved success who has lived well, laughed often, and loved much; Who has enjoyed the trust of pure women, the respect of intelligent men and the love of little children; Who has filled his niche and accomplished his task; Who has never lacked appreciation of Earth's beauty or failed to express it; Who has left the world better than he found it, Whether an improved poppy, a perfect poem, or a rescued soul; Who has always looked for the best in others and given them the best he had; Whose life was an inspiration; Whose memory a benediction.", author: "Bessie Anderson Stanley" },

            // Bill Watterson
            // { text: "You know, sometimes kids get bad grades in school because the class moves too slow for them. Einstein got D's in school. Well guess what, I get F's!!!", author: "Bill Watterson" },

            // A.A. Milne
            { text: "Piglet sidled up to Pooh from behind. 'Pooh!' he whispered. 'Yes, Piglet?' 'Nothing,' said Piglet, taking Pooh's paw. 'I just wanted to be sure of you.'", author: "A.A. Milne" },

            // Buddha
            { text: "A jug fills drop by drop.", author: "Gautama Buddha" },
            { text: "A man asked Gautama Buddha, 'I want happiness.' Buddha said, 'First remove \"I,\" that's Ego, then remove \"want,\" that's Desire. See, now you are left with only \"Happiness.\"'", author: "Gautama Buddha" },

            // Craig Wynett
            { text: "All that we are is the result of what we have thought: it is founded on our thoughts and made up of our thoughts. If a man speak or act with an evil thought, suffering follows him as the wheel follows the hoof of the beast that draws the wagon.... If a man speak or act with a good thought, happiness follows him like a shadow that never leaves him.", author: "Gautama Buddha" },
            { text: "Anger will never disappear so long as thoughts of resentment are cherished in the mind.", author: "Gautama Buddha" },
            { text: "Bahujanahitāya bahujanasukhāya lokānukampāya: For the good of the many, for the happiness of the many, out of compassion for the world.", author: "Gautama Buddha" },
            { text: "Be a lamp unto yourself. Work out your liberation with diligence.", author: "Gautama Buddha" },
            { text: "Better than a thousand hollow words, is one word that brings peace.", author: "Gautama Buddha" },
            { text: "Do not dwell in the past, do not dream of the future, concentrate the mind on the present moment.", author: "Gautama Buddha" },
            { text: "Do not overlook tiny good actions, thinking they are of no benefit; even tiny drops of water in the end will fill a huge vessel. Do not overlook negative actions merely because they are small; however small a spark may be, it can burn down a haystack as big as a mountain.", author: "Gautama Buddha" },
            { text: "Doubt everything. Find your own light.", author: "Gautama Buddha" },
            { text: "Embrace nothing: If you meet the Buddha, kill the Buddha. If you meet your father, kill your father. Only live your life as it is, Not bound to anything.", author: "Gautama Buddha" },
            { text: "Hatred does not cease by hatred, but only by love; this is the eternal rule.", author: "Gautama Buddha" },
            { text: "Hatred does not cease through hatred at any time. Hatred ceases through love. This is an unalterable law.", author: "Gautama Buddha" },
            { text: "He who loves 50 people has 50 woes; he who loves no one has no woes.", author: "Gautama Buddha" },
            { text: "Health is the greatest gift, contentment is the greatest wealth", author: "Gautama Buddha" },
            { text: "If a traveller does not meet with one who is his better, or his equal, let him firmly keep to his solitary journey; there is no companionship with a fool.", author: "Gautama Buddha" },
            { text: "If anything is worth doing, do it with all your heart.", author: "Gautama Buddha" },
            { text: "If we fail to look after others when they need help, who will look after us?", author: "Gautama Buddha" },
            { text: "If you knew what I know about the power of giving, you would not let a single meal pass without sharing it in some way.", author: "Gautama Buddha" },
            { text: "If you light a lamp for somebody, it will also brighten your path.", author: "Gautama Buddha" },
            { text: "In the end, only three things matter: how much you loved, how gently you lived, and how gracefully you let go of things not meant for you.", author: "Gautama Buddha" },
            { text: "It is a man's own mind, not his enemy or foe, that lures him to evil ways.", author: "Gautama Buddha" },
            { text: "It is better to die fighting than to live as one vanquished", author: "Gautama Buddha" },
            { text: "It is easy to see the faults of others, but difficult to see one’s own faults. One shows the faults of others like chaff winnowed in the wind, but one conceals one’s own faults as a cunning gambler conceals his dice.", author: "Gautama Buddha" },
            { text: "It seems that although we thought ourselves permanent, we are not. Although we thought ourselves settled, we are not. Although we thought we would last forever, we will not.", author: "Gautama Buddha" },
            { text: "Know well what leads you forward and what holds you back, and choose the path that leads to wisdom.", author: "Gautama Buddha" },
            { text: "Meditation brings wisdom; lack of meditation leaves ignorance.", author: "Gautama Buddha" },
            { text: "No one saves us but ourselves. No one can and no one may. We ourselves must walk the path.", author: "Gautama Buddha" },
            { text: "Nothing can harm you as much as your own thoughts unguarded.", author: "Gautama Buddha" },
            { text: "Nothing ever exists entirely alone; everything is in relation to everything else.", author: "Gautama Buddha" },
            { text: "Nothing is forever except change.", author: "Gautama Buddha" },
            { text: "Now, Kalamas, don’t go by reports, by legends, by traditions, by scripture, by logical conjecture, by inference, by analogies, by agreement through pondering views, by probability, or by the thought, ‘This contemplative is our teacher.’ When you know for yourselves that, ‘These qualities are skillful; these qualities are blameless; these qualities are praised by the wise; these qualities, when adopted & carried out, lead to welfare & to happiness’ — then you should enter & remain in them.", author: "Gautama Buddha" },
            { text: "Our life is shaped by our mind; we become what we think. Suffering follows an evil thought as the wheels of a cart follow the oxen that draws it. Our life is shaped by our mind; we become what we think. Joy follows a pure thought like a shadow that never leaves.", author: "Gautama Buddha" },
            { text: "People with opinions just go around bothering each other.", author: "Gautama Buddha" },
            { text: "Set your heart on doing good. Do it over and over again, And you will be filled with joy.", author: "Gautama Buddha" },
            { text: "Silence the angry man with love. Silence the ill-natured man with kindness. Silence the miser with generosity. Silence the liar with truth.", author: "Gautama Buddha" },
            { text: "THE FOUR NOBLE TRUTHS: I. Suffering does exist. II. Suffering arises from 'attachment' to desires. III. Suffering ceases when 'attachment' to desire ceases. IV. Freedom from suffering is possible by practicing the eightfold path.", author: "Gautama Buddha" },
            { text: "The Way is not in the sky; the Way is in the heart.", author: "Gautama Buddha" },
            { text: "The forest is a peculiar organism of unlimited kindness and benevolence that makes no demands for its sustenance and extends generously the products of its life activity; it affords protection to all beings, offering shade even to the axe-man who destroys it.", author: "Gautama Buddha" },
            { text: "The ignorant man is an ox. He grows in size, not in wisdom.", author: "Gautama Buddha" },
            { text: "The mind is everything. What you think you become.", author: "Gautama Buddha" },
            { text: "The only real failure in life is not to be true to the best one knows.", author: "Gautama Buddha" },
            { text: "The root of suffering is attachment.", author: "Gautama Buddha" },
            { text: "The teaching is simple. Do what is right. Be Pure.", author: "Gautama Buddha" },
            { text: "The virtuous man delights in this world and he delights in the next", author: "Gautama Buddha" },
            { text: "The wise man makes an island of himself that no flood can overwhelm.", author: "Gautama Buddha" },
            { text: "There are only two mistakes one can make along the road to truth; not going all the way, and not starting.", author: "Gautama Buddha" },
            { text: "There has to be evil so that good can prove its purity above it.", author: "Gautama Buddha" },
            { text: "There is nothing so disobedient as an undisciplined mind, and there is nothing so obedient as a disciplined mind.", author: "Gautama Buddha" },
            { text: "Though one should live a hundred years without wisdom and control, yet better, indeed, is a single day’s life of one who is wise and meditative.", author: "Gautama Buddha" },
            { text: "Three things can not hide for long: the Moon, the Sun and the Truth.", author: "Gautama Buddha" },
            { text: "To insist on a spiritual practice that served you in the past is to carry the raft on your back after you have crossed the river.", author: "Gautama Buddha" },
            { text: "We will develop love, we will practice it, we will make it both a way and a basis…", author: "Gautama Buddha" },
            { text: "What we’ve done to encourage innovation is make it ordinary.", author: "Craig Wynett" },
            { text: "When you like a flower, you just pluck it. But when you love a flower, you water it daily.", author: "Gautama Buddha" },
            // Carl Jung
            { text: "Without the playing with fantasy no creative work has ever yet come to birth. The debt we owe to the play of imagination is incalculable.", author: "Carl Jung" },

            // Carl Sagan
            { text: "If you are only skeptical, then no new ideas make it through to you.", author: "Carl Sagan" },

            // Charles M. Schulz
            { text: "All you need is love. But a little chocolate now and then doesn't hurt.", author: "Charles M. Schulz" },

            // Charles Brower
            { text: "A new idea is delicate. It can be killed by a sneer or a yawn; it can be stabbed to death by a quip and worried to death by a frown on the right man’s brow.", author: "Charles Brower" },

            // Charles Kettering
            { text: "99 percent of success is built on failure.", author: "Charles Kettering" },
            { text: "A problem well stated is a problem half solved.", author: "Charles Kettering" },
            { text: "All human development, no matter what form it takes, must be outside the rules; otherwise we would never have anything new.", author: "Charles Kettering" },
            { text: "If you have always done it that way, it is probably wrong.", author: "Charles Kettering" },

            // Charles Peguy
            { text: "It is the essence of genius to make use of the simplest ideas.", author: "Charles Peguy" },

            // Chuck Jones
            { text: "Anxiety is the hand maiden of creativity.", author: "Chuck Jones" },
            { text: "We must not confuse distortion with innovation; distortion is useless change, art is beneficial change.", author: "Chuck Jones" },

            // C.S. Lewis
            { text: "Friendship ... is born at the moment when one man says to another \"What! You too? I thought that no one but myself . . .", author: "C.S. Lewis" },
            { text: "Some day you will be old enough to start reading fairy tales again.", author: "C.S. Lewis" },
            { text: "To love at all is to be vulnerable. Love anything and your heart will be wrung and possibly broken. If you want to make sure of keeping it intact you must give it to no one, not even an animal. Wrap it carefully round with hobbies and little luxuries; avoid all entanglements. Lock it up safe in the casket or coffin of your selfishness. But in that casket, safe, dark, motionless, airless, it will change. It will not be broken; it will become unbreakable, impenetrable, irredeemable. To love is to be vulnerable.", author: "C.S. Lewis" },
            { text: "You can never get a cup of tea large enough or a book long enough to suit me.", author: "C.S. Lewis" },

            // Cassandra Clare
